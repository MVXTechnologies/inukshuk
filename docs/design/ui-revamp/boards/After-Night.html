<button aria-pressed="false" style="height: 44px; box-sizing: border-box; border: 1px solid #7A1C17; border-radius: 10px; padding: 0; background: #000000; color: #FF3B30; font-size: 14px; font-weight: 700">Sun</button>
<button aria-pressed="true" style="height: 44px; box-sizing: border-box; border: 2px solid #FF3B30; border-radius: 10px; padding: 0; background: #1A0000; color: #FF3B30; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>Night</button>

<a href="Display-Modes.dc.html" style="height: 44px; border-top: 1px solid #3A0B08; display: flex; align-items: center; justify-content: space-between; color: #FF3B30; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">All display options<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>More</button>
<span style="justify-self: end; font-size: 12px; font-weight: 600; color: #FF3B30">Hold to stop</span>
