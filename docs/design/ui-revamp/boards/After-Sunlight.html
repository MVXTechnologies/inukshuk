<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording, Sunlight theme (after)</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,system-ui,sans-serif;color:#000000}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', -apple-system, system-ui, sans-serif; color: #000000">
<img src="blobs/3db94b52e48f9cb53b86db8e3d384777.svg" alt="High-contrast topographic map: white ground, black contours, recorded track in orange with white and black casing" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block">

<button aria-label="Compass: north up. Tap to reset bearing" style="position: absolute; left: 16px; top: 54px; width: 48px; height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid #000000; padding: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 16.2 12H7.8Z" fill="#C62828"></path><path d="M12 21.5 7.8 12h8.4Z" fill="#000000"></path></svg>
</button>

<div style="position: absolute; right: 16px; top: 54px; display: flex; flex-direction: column; gap: 8px">
<button aria-pressed="true" aria-label="Following my position. Tap to stop following" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid #000000; padding: 0; background: #FFFFFF; color: #1565C0; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"></circle><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"></path><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle></svg>
</button>
<div style="width: 48px; box-sizing: border-box; border-radius: 16px; overflow: hidden; border: 2px solid #000000; background: #FFFFFF; display: flex; flex-direction: column">
<button aria-label="Base map" style="width: 44px; height: 46px; border: 0; padding: 0; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"></path><path d="m3 12 9 4.5 9-4.5"></path><path d="m3 16.5 9 4.5 9-4.5"></path></svg>
</button>
<div style="height: 2px; background: #000000"></div>
<button aria-label="Map overlays (PDF maps)" style="width: 44px; height: 46px; border: 0; padding: 0; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7Z"></path><path d="M14 3v5h5"></path><path d="M10 13.5c1.5-1.2 3-.2 4.5-1"></path><path d="M10 17.5c1.5-1.2 3-.2 4.5-1"></path></svg>
</button>
</div>
<button aria-label="More actions: waypoint, download area, make a map, coordinates" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 16px; border: 2px solid #000000; padding: 0; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>

<div aria-label="Scale 500 metres" style="position: absolute; left: 16px; top: 510px; display: flex; flex-direction: column; gap: 2px; padding: 4px 8px; border-radius: 8px; border: 2px solid #000000; background: #FFFFFF">
<span style="font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; color: #000000">500 m</span>
<div style="width: 62px; height: 5px; border: 2px solid #000000; border-top: 0"></div>
</div>

<section aria-label="Recording options" style="position: absolute; left: 118px; top: 292px; width: 260px; box-sizing: border-box; padding: 12px; border-radius: 18px; border: 2px solid #000000; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.12)">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #000000">DISPLAY · OPT-IN</span>
<div role="group" aria-label="Display mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #000000; border-radius: 12px; overflow: hidden">
<button aria-pressed="false" style="height: 44px; border: 0; padding: 0; background: #FFFFFF; color: #000000; font-size: 14px; font-weight: 800">Normal</button>
<button aria-pressed="true" style="height: 44px; border: 0; border-left: 2px solid #000000; border-right: 2px solid #000000; padding: 0; background: #000000; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg>Sun</button>
<button aria-pressed="false" style="height: 44px; border: 0; padding: 0; background: #FFFFFF; color: #000000; font-size: 14px; font-weight: 800">Night</button>
</div>
<button role="switch" aria-checked="true" style="height: 48px; border: 0; padding: 0; background: transparent; color: #000000; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 800; text-align: left">Auto night at sunset<span style="width: 44px; height: 26px; box-sizing: border-box; border-radius: 13px; background: #000000; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF"></span></span></button>
<button style="height: 48px; border: 0; border-top: 2px solid #000000; padding: 0; background: transparent; color: #000000; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Glove lock</button>
<a href="Display-Modes.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: space-between; color: #000000; font-size: 15px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px">All display options<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
</section>

<section aria-label="Recording instruments" style="position: absolute; left: 0; top: 558px; width: 390px; height: 286px; box-sizing: border-box; background: #FFFFFF; border-top: 2px solid #000000; border-radius: 20px 20px 0 0; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 6px; background: #000000; flex-shrink: 0"></div>
<div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0 14px">
<div role="status" style="display: flex; gap: 6px; align-items: center">
<span style="display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 15px; background: #000000; color: #FFFFFF; font-size: 13px; font-weight: 800; letter-spacing: 0.08em">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #FF3B30"></span>REC</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 15px; border: 2px solid #000000; color: #000000; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">GPS ±5 m</span>
</div>
<div style="display: flex; gap: 2px">
<button aria-label="Minimize to a small overlay" style="width: 48px; height: 48px; border: 0; padding: 0; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<button aria-expanded="true" aria-label="Recording options: glove lock, display mode" style="width: 48px; height: 44px; margin-top: 2px; border: 0; border-radius: 22px; padding: 0; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="19" cy="12" r="2.2"></circle></svg>
</button>
</div>
</div>

<div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr; padding: 0 8px">
<button aria-label="Time 1 hour 2 minutes 14 seconds. Tap to change field" style="border: 0; padding: 2px 0 6px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 40px; line-height: 46px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">1:02:14</span>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em">TIME</span>
</button>
<button aria-label="Distance 3.42 kilometres. Tap to change field" style="border: 0; border-left: 2px solid #000000; padding: 2px 0 6px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 40px; line-height: 46px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">3.42<span style="font-size: 16px; font-weight: 800"> km</span></span>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em">DISTANCE</span>
</button>
<button aria-label="Elevation gain 268 metres. Tap to change field" style="border: 0; border-left: 2px solid #000000; padding: 2px 0 6px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 40px; line-height: 46px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">+268<span style="font-size: 16px; font-weight: 800"> m</span></span>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em">GAIN</span>
</button>
</div>

<div style="display: flex; gap: 10px; align-items: center; padding: 12px 16px 0">
<button aria-label="Pause" style="flex-grow: 1; height: 56px; border-radius: 28px; border: 2px solid #000000; padding: 0 20px; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>Pause</button>
<button aria-label="Add waypoint" style="width: 116px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 2px solid #000000; padding: 0 16px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 800; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.74 15.27L10.33 15.27Q10.98 15.27 10.89 15.91L9.96 22.36Q9.87 23 9.22 23L5.98 23Q5.33 23 5.47 22.37L6.95 15.90Q7.09 15.27 7.74 15.27Z"></path><path d="M13.67 15.27L16.26 15.27Q16.91 15.27 17.05 15.90L18.53 22.37Q18.67 23 18.02 23L14.78 23Q14.13 23 14.04 22.36L13.11 15.91Q13.02 15.27 13.67 15.27Z"></path><path d="M7.46 10.45L16.54 10.45Q17.19 10.45 17.19 11.10L17.19 14.15Q17.19 14.80 16.54 14.80L7.46 14.80Q6.81 14.80 6.81 14.15L6.81 11.10Q6.81 10.45 7.46 10.45Z"></path><path d="M3.01 6.74L20.99 6.74Q21.63 6.74 21.63 7.39L21.63 9.34Q21.63 9.99 20.99 9.99L3.01 9.99Q2.37 9.99 2.37 9.34L2.37 7.39Q2.37 6.74 3.01 6.74Z"></path><path d="M10.15 1L13.85 1Q14.50 1 14.50 1.65L14.50 5.63Q14.50 6.28 13.85 6.28L10.15 6.28Q9.50 6.28 9.50 5.63L9.50 1.65Q9.50 1 10.15 1Z"></path></svg>Mark</button>
<button aria-label="Stop recording (press and hold)" style="position: relative; width: 56px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 2px solid #000000; padding: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="position: absolute; left: 0; top: 0"><circle cx="26" cy="26" r="22" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="48 140" transform="rotate(-90 26 26)"></circle></svg>
<span style="width: 18px; height: 18px; border-radius: 3px; background: #C62828"></span>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; padding: 2px 16px 0">
<span></span>
<button aria-label="Show more fields" style="justify-self: center; height: 44px; border: 0; padding: 0 14px; background: transparent; color: #000000; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>More</button>
<span style="justify-self: end; font-size: 13px; font-weight: 800; color: #000000">Hold to stop</span>
</div>
</section>
</div>
</x-dc>

  }

</body>
</html>
