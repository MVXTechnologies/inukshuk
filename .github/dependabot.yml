version: 2
updates:
  # Keep npm dependencies fresh. Grouped so related bumps land in one PR and CI
  # gates them; the dependabot-automerge workflow merges green minor/patch PRs,
  # except native-bearing ones (the `native` group below).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # React's version is dictated by the installed Expo SDK / React Native
      # renderer. Bumping it independently crashes the app at launch with an
      # "Incompatible React versions" error (see #8). These move only via
      # `expo install` during an SDK upgrade, never on their own.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      # pdf.js is BUNDLED as committed WebView assets (assets/pdfjs/*.pdfjs,
      # copied from the package by scripts/pdfjs/sync-assets.mjs); the npm
      # package pins their provenance. Any bump fails CI until the assets are
      # re-synced (scripts/pdfjs/assets.test.mjs) and, usually, the layer
      # filter is re-anchored (src/core/geo/pdfWorkerPatch.ts) — then the
      # device-only rasterizer pipeline must be revalidated. Majors are a
      # migration (3 → 6 was), so Dependabot only proposes minors and patches.
      - dependency-name: 'pdfjs-dist'
        update-types: ['version-update:semver-major']
      # Everything below is version-managed by the Expo SDK: CI's
      # `npx expo install --check` gate rejects any independent bump (see the
      # never-mergeable PRs #68/#69), so don't propose them. They move together
      # via `npx expo install` during an SDK upgrade.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: 'babel-preset-expo'
      # eslint-config-expo's major tracks the Expo SDK major (57.x targets SDK
      # 57): the pin gate rejects any independent bump (see PR #76). It moves
      # with `npx expo install --fix` during an SDK upgrade.
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major']
      # eslint itself is locked to what eslint-config-expo's plugins support:
      # ESLint 10 removed context.getFilename(), which crashes the pinned
      # eslint-plugin-react (see PR #148). Moves with the SDK upgrade too.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
      - dependency-name: 'jest-*'
      - dependency-name: '@types/jest'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
    groups:
      # Native-bearing packages, in ONE PR: a bump to any of them changes the
      # binary, so it ships in a store build and is never auto-merged. Mirrors
      # NATIVE_DEPENDENCIES in .github/workflows/dependabot-automerge.yml, the
      # list that actually holds them back (scripts/ci/dependabotNative.test.mjs
      # keeps the two in step). Most of these are also ignored above and move
      # with `npx expo install`; @maplibre/* and @dr.pogodin/* are not, and
      # were auto-merged mid-runtime before (28498e3, 7ffb3cc, c6b7a49, 91df235).
      # This group replaces the old `expo` one; its @expo/* entry is SDK-managed
      # and ignored above, so no group needs it.
      native:
        patterns:
          - '@maplibre/*'
          - '@dr.pogodin/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
          - 'expo'
          - 'expo-*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'jest*'
          - '@testing-library/*'
          - 'typescript'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
