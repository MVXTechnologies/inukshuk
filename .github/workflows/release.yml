name: Release (Build & Submit to Stores)

# Builds production binaries on EAS and submits them to the App Store
# (TestFlight) and Google Play (internal testing track). Promotion to the
# public stores is a manual step in each console (docs/DEPLOYMENT.md §
# Releasing). Triggered by pushing a version tag like `v1.0.0`, or manually.
# No-ops until the required secrets are set — see docs/DEPLOYMENT.md for the
# full account/secret checklist.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build & submit
        type: choice
        default: all
        options: [all, ios, android]

# Least privilege: the GITHUB_TOKEN can only read the repository. A job that
# needs more says so itself.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    # Same environment as the publishing job, so the check still sees
    # EXPO_TOKEN once it is an environment secret rather than a repo secret.
    environment: production
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        run: echo "enabled=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  build-submit:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Store credentials and EXPO_TOKEN belong to this environment once the
    # owner moves them there (docs/CI.md § Who can publish): then only runs
    # the environment's rules allow (tags v*, main) can read them.
    environment: production
    # `secrets` can't be referenced in a step-level `if:`; surface their presence
    # as job-level env (which `if:` may read) instead.
    env:
      HAS_GSA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_ASC: ${{ secrets.ASC_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
      - name: Verify SDK-pinned dependency versions
        run: npx expo install --check
      - name: Verify release candidate
        run: npm run check

      # Materialize store credentials from secrets into the files referenced by
      # eas.json's submit profile. Missing secrets simply produce empty files;
      # eas submit will then report the specific missing credential.
      - name: Write Google Play service account key
        if: env.HAS_GSA == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: Write App Store Connect API key
        if: env.HAS_ASC == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > asc-api-key.p8

      # The input goes through env, never spliced into the script: `${{ }}` in
      # `run:` is text substitution, i.e. shell injection for any free-form value.
      - name: Build and submit
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in all | ios | android) ;; *) echo "bad platform: $PLATFORM" >&2; exit 1 ;; esac
          eas build \
            --platform "$PLATFORM" \
            --profile production \
            --auto-submit \
            --non-interactive \
            --no-wait
