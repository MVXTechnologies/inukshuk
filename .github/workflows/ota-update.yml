name: OTA Update

# Self-correction in the field: every merge to main that changes JS/assets is
# published as an over-the-air EAS Update, so shipped apps pick up fixes without
# a new store submission. No-ops until EXPO_TOKEN is configured.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'package.json'
      - 'app.config.ts'
  workflow_dispatch:
    inputs:
      app_version_override:
        description: >
          Publish this update for an OLDER runtime by overriding the app
          version (e.g. "1.4.0"). Needed after a version bump: pushes to main
          publish only for the NEW runtime, and installs still on the previous
          store build stop receiving fixes unless their runtime is re-published
          too (the runtime-lineage trap). Leave empty for the current version.
        required: false
        default: ''

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        run: echo "enabled=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  update:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Apply app version override (legacy-runtime publish)
        if: github.event.inputs.app_version_override != ''
        run: |
          v="${{ github.event.inputs.app_version_override }}"
          sed -i "s/^  version: '.*',$/  version: '$v',/" app.config.ts
          grep -n "version: '$v'" app.config.ts
      - name: Publish OTA update to the production channel
        # ERROR_REPORT_TOKEN must be present when app.config.ts is evaluated
        # here: clients read `extra` from the LATEST update's manifest, not the
        # store build, so an OTA published without it silently disables
        # automatic error reports for every updated install. (Empty/missing is
        # harmless — the app treats '' as no channel and just queues.)
        env:
          ERROR_REPORT_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
        run: eas update --auto --branch production --non-interactive
