name: OTA Update

# Self-correction in the field: every merge to main that changes JS/assets is
# published as an over-the-air EAS Update, so shipped apps pick up fixes without
# a new store submission. No-ops until EXPO_TOKEN is configured.
#
# The update targets the runtime FINGERPRINT of this checkout (app.config.ts
# `runtimeVersion`): only binaries built from the same native project receive
# it. A merge that changes native code — a native dependency bump included —
# publishes to a runtime no installed binary has yet, and reaches no one until
# a store build ships with it. That is the point, not a failure.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.ts'
      - 'babel.config.js'
      - 'metro.config.js'
      - '.github/workflows/ota-update.yml'
  # No inputs. `app_version_override` is gone: it republished HEAD to an older
  # runtime by rewriting `version`, which only meant something while the
  # runtime WAS the version. Under the fingerprint policy it would change
  # nothing — and pushing HEAD's JS to an older binary is the very skew the
  # fingerprint prevents. A fix for an older binary is published by running
  # this workflow on a branch cut from that binary's release tag (see
  # docs/DEPLOYMENT.md § Field updates without a store release).
  # `platform`: a hotfix branch can match one platform's store runtime but
  # not the other's (2.3.0: iOS build 18 predates #581, Android vc63 does
  # not). Publish only the platform the branch exists for, so it never
  # supersedes main's update on the other one.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to publish
        type: choice
        options: [all, ios, android]
        default: all

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        run: echo "enabled=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  update:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Check this exact checkout before it can reach installed apps. The CI
      # workflow runs independently and cannot gate this job by itself.
      - name: Verify SDK-pinned dependency versions
        run: npx expo install --check
      - name: Verify release candidate
        run: npm run check
      # Clients read `extra` from the LATEST update's manifest, not from the
      # store build, and the manifest's `extra` is app.config.ts evaluated on
      # THIS runner: a credential missing here is missing on every install
      # that takes the update (Strava "not configured", error reports stuck
      # on the device). `--environment production` below loads the EAS
      # production variables, but secret-visibility ones never leave EAS's
      # servers — so ERROR_REPORT_TOKEN must also be a GitHub secret here,
      # with the same value. (The Strava client secret lives only on the
      # token proxy, never in the app.) Each is exported only when
      # set: GitHub renders an unset secret as '', and an empty variable must
      # not shadow a value EAS would otherwise supply.
      - name: Load update credentials
        env:
          STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
          ERROR_REPORT_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          ERROR_REPORT_ENDPOINT: ${{ vars.ERROR_REPORT_ENDPOINT }}
        run: |
          for name in STRAVA_CLIENT_ID ERROR_REPORT_TOKEN ERROR_REPORT_ENDPOINT; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__INUKSHUK_ENV__"; printf '%s\n' "${!name}"; echo '__INUKSHUK_ENV__'; } >> "$GITHUB_ENV"
            fi
          done
      # Fails before anything is published if a required key would be empty
      # in the update's manifest; prints which keys are set, never values.
      # OTA_REQUIRED_EXTRA (repo variable, comma-separated, `none` to disable)
      # overrides the default — the Strava client id every production binary has.
      - name: Check the update's extra before it reaches installed apps
        env:
          REQUIRED_EXTRA: ${{ vars.OTA_REQUIRED_EXTRA || 'stravaClientId' }}
        run: >
          node scripts/ci/assert-update-extra.mjs
          --require "$REQUIRED_EXTRA"
          --any-of errorReportEndpoint,errorReportToken
      - name: Publish OTA update to the production channel
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: eas update --auto --branch production --environment production --platform "$PLATFORM" --non-interactive
