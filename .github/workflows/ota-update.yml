name: OTA Update

# Publish JS only when the current runtime's finished binaries have matching
# native inputs. Never rewrite the app version to target an older runtime.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.ts'
      - 'modules/**'
      - 'plugins/**'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'scripts/ci/**'
      - '.github/workflows/ota-update.yml'
  workflow_dispatch:

permissions:
  contents: read

# Finish an already-started publish before a newer one can become latest.
concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  update:
    name: Verify compatibility and publish OTA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require main and configured Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Production OTA must run on main.' >&2; exit 1; }
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN is required; no update was published.' >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx expo install --check
      - run: npm run check
      - run: node --test scripts/ci/*.test.mjs
      - name: Compare native inputs with this runtime's store builds
        id: compatibility
        run: |
          npx expo config --json > "$RUNNER_TEMP/config.json"
          version=$(node -p 'require(process.env.RUNNER_TEMP+"/config.json").version')
          node scripts/ci/release-policy.mjs history "$RUNNER_TEMP/builds.json" all "$version"
          node scripts/ci/release-policy.mjs ota-compatible "$RUNNER_TEMP/builds.json" "$RUNNER_TEMP/config.json"
      - name: Check native runtime health before publishing
        if: steps.compatibility.outputs.compatible == 'true'
        run: npx --yes expo-doctor@1.20.4
      - name: Publish OTA to production
        if: steps.compatibility.outputs.compatible == 'true'
        env:
          ERROR_REPORT_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          ERROR_REPORT_ENDPOINT: ${{ vars.ERROR_REPORT_ENDPOINT }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Superseded by a newer main commit; no update published.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          eas update --channel production --environment production --message "Commit $GITHUB_SHA" --non-interactive
          echo "Published production OTA for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
