name: CI

# Quality gate: runs on every push and PR. Fast, free, no native build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Format · Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: catches a `react` / native-renderer (or any SDK-pinned dep)
      # version drift that typechecks and unit-tests green but crashes the app
      # at runtime — exactly the class of bug that shipped in #8.
      - name: Verify SDK-pinned dependency versions
        run: npx expo install --check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:ci

      - name: CI release policy regression tests
        run: node --test scripts/ci/*.test.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  doctor:
    name: Expo runtime health
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime/dependency health is a separate check from code correctness.
      # A known native regression must remain visible on PRs as well as nightly.
      - run: npx --yes expo-doctor@1.20.4

  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Actions syntax, expressions, and shell scripts
        uses: docker://rhysd/actionlint:1.7.12
