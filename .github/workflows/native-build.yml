name: Native Build Test

# Proves the app actually compiles into real iOS and Android binaries on the
# latest toolchains. No code signing, no store accounts needed — pure compile
# verification. Builds on PRs that touch native-affecting files, and nightly.
#
# Runs on EVERY pull request, deliberately without a `paths` filter (#369):
# `Android (Gradle assembleDebug)` is a required check on main, and a workflow
# skipped by path filtering never reports its checks, so a docs-only PR waited
# forever on a check that could not arrive. The `changes` job does the
# filtering instead and the build jobs are skipped by `if` — and GitHub counts
# a job skipped by a conditional as a passing required check: "If, however, a
# job within a workflow is skipped due to a conditional, it will report its
# status as 'Success'" (docs.github.com, "Troubleshooting required status
# checks" › "Handling skipped but required checks").
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:30 UTC daily — catches breakage from new Xcode / Android SDK images.
    - cron: '30 4 * * *'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this PR can affect the native build. Schedule and manual
  # runs always build.
  changes:
    name: Detect native-affecting changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      # A pull_request checkout is the PR's merge commit; depth 2 brings its
      # first parent, which is the base branch tip it merges onto.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      # Native-affecting paths: the manifests and Expo config, JS/TS sources
      # and assets bundled into the binary, config plugins, the local native
      # modules (modules/**, built by both jobs), and this workflow.
      # --no-renames lists both sides of a rename, so moving a file OUT of
      # src/ still counts.
      - name: Diff against the PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "could not diff against the base; building to be safe"
            echo "native=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          native_re='^(package\.json|package-lock\.json|app\.config\.ts|app\.json|\.github/workflows/native-build\.yml)$|^(src|app|assets|plugins|modules)/'
          if printf '%s\n' "$files" | grep -Eq "$native_re"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No native-affecting changes: the build jobs are skipped (a skipped job passes)."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android (Gradle assembleDebug)
    needs: changes
    # Only an explicit 'false' skips: if `changes` itself failed, its output is
    # empty and this builds rather than letting a required check pass unbuilt.
    # !cancelled() is what lets it run after a failed `changes`.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.native != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The RN + reanimated/worklets NDK build exhausts the runner's small disk
      # ("No space left on device"). Reclaim the large preinstalled toolchains we
      # don't use (dotnet ~25GB, GHC, boost, swift) before building.
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Verify native PDF geometry and private paths
        run: sh modules/inukshuk-pdf/scripts/test-geometry.sh

      # The C++ 3D-terrain engine shared by Android and iOS, checked against
      # the TS reference's parity fixtures (src/core/terrain3d/parity.test.ts).
      - name: Verify native 3D terrain engine (C++)
        run: sh modules/inukshuk-terrain/tests/run.sh

      - uses: android-actions/setup-android@v4

      # Gradle's dependency caches live in ~/.gradle regardless of the
      # prebuild-generated android/ dir, so they ARE cacheable in this CNG repo
      # (setup-java's `cache: gradle` is not — it keys on gradle files that
      # don't exist at checkout, see #77). Keyed on the lockfile since the
      # native deps derive from the RN/Expo packages.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS (xcodebuild simulator)
    needs: changes
    # Same gate as android.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.native != 'false') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # A Swift Package dependency requires Swift tools 6.2; the image's default
      # Xcode 16.4 ships Swift 6.1, so package resolution fails ("Could not
      # resolve package dependencies"). Select the newest stable Xcode (Swift 6.2+).
      - name: Select newest Xcode (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Caches downloaded pod artifacts (not the generated Pods/ dir, which
      # depends on the prebuild output) — keyed on the lockfile like Gradle.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Verify iOS PDF paint and JPEG guards
        run: sh modules/inukshuk-pdf/ios/Tests/run.sh

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Compile for simulator (no signing)
        run: |
          xcodebuild \
            -workspace ios/Inukshuk.xcworkspace \
            -scheme Inukshuk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
