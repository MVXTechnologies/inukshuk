name: Native Build Test

# Compile native inputs on PRs; nightly/manual runs exercise the full build.
# Keep this workflow present on every PR so its existing check names report
# "skipped" for JS/docs-only changes instead of remaining pending.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:30 UTC daily — verifies main against the selected native toolchains.
    - cron: '30 4 * * *'

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect native build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check all changed paths (including deleted and renamed inputs)
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          native=true
          if [ "$EVENT_NAME" = pull_request ]; then
            native=false
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/native-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                package.json|package-lock.json|app.config.*|app.json|eas.json|babel.config.*|metro.config.*|tsconfig.json|.npmrc|.nvmrc|.node-version|assets/*|plugins/*|modules/*|patches/*|android/*|ios/*|scripts/eas-pre-install.sh|.github/workflows/native-build.yml)
                  native=true ;;
              esac
            done < "$RUNNER_TEMP/native-paths"
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native compilation required: $native" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (Gradle assembleDebug)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The RN + reanimated/worklets NDK build exhausts the runner's small disk
      # ("No space left on device"). Reclaim the large preinstalled toolchains we
      # don't use (dotnet ~25GB, GHC, boost, swift) before building.
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Verify native PDF geometry and private paths
        run: sh modules/inukshuk-pdf/scripts/test-geometry.sh

      - uses: android-actions/setup-android@v4

      # Gradle's dependency caches live in ~/.gradle regardless of the
      # prebuild-generated android/ dir, so they ARE cacheable in this CNG repo
      # (setup-java's `cache: gradle` is not — it keys on gradle files that
      # don't exist at checkout, see #77). Keyed on the lockfile since the
      # native deps derive from the RN/Expo packages.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (xcodebuild simulator)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Xcode 26.3 is verified by successful native run 34332683125.
      # Keep Swift 6.2+ support without silently selecting a new stable Xcode.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Report native toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Caches downloaded pod artifacts (not the generated Pods/ dir, which
      # depends on the prebuild output) — keyed on the lockfile like Gradle.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Verify iOS PDF paint and JPEG guards
        run: sh modules/inukshuk-pdf/ios/Tests/run.sh

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Compile for simulator (no signing)
        run: |
          xcodebuild \
            -workspace ios/Inukshuk.xcworkspace \
            -scheme Inukshuk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
