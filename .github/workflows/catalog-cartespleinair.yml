name: Catalog — Cartes Plein-air

# Weekly crawl of the Cartes Plein-air canoe maps (#680), used with the
# publisher's written permission (docs/CATALOG-SOURCES.md §1.6).
#
# The site has no feed and its map URLs cannot be guessed, and maps are
# published, withdrawn and republished often, so the only way to keep the
# catalog true is to look. scripts/catalog/fetch-cartespleinair.ts does, politely:
# its own User-Agent, robots.txt obeyed, at most one request per second per
# host, and never a PDF download (one HEAD per new file).
#
# Like every catalog source, the crawl only rewrites its fragment
# (scripts/catalog/fragments/cartes-plein-air.json) and its river gazetteer.
# When they changed, this opens (or refreshes) ONE pull request,
# `catalog/cartes-plein-air`, whose body lists what was added, withdrawn and
# republished. A maintainer reviews it, merges it, and publishes with
# `npx tsx scripts/catalog/build-manifest.ts` (docs/CATALOG.md §4) — the
# publish step needs the other sources' fragments and the DEM cache, which
# live on the maintainer's machine, not here. The source needs credit
# rendering, so that publish changes docs/catalog/v3/ only: v2, which apps
# before 2.5.2 read, stays byte-identical (docs/CATALOG.md §7).
#
# A crawl that would withdraw more than a fifth of the maps at once (a broken
# or redesigned listing page) fails instead of opening a PR; ci-health then
# reports the red run.
#
# The crawl reads the open web and runs npm packages, so it never holds a
# credential: the checkout keeps no token, install scripts do not run, and
# the token reaches git only in the push itself.
#
# The PR branch is rewritten each week (force-push), unless a person has
# committed to it (an edit made in review): then the run leaves it alone,
# says so in the log, and the next crawl after the merge picks up the rest.
#
# Pull requests opened with the GITHUB_TOKEN do not start CI themselves (a
# GitHub rule). The change is data only and the crawler validated it with the
# app's own parser; close and reopen the PR to run CI on it before merging.
# The repository must allow Actions to create pull requests (Settings ›
# Actions › General › Workflow permissions).
on:
  schedule:
    # Mondays 07:17 UTC (off the hour: scheduled runs at :00 are delayed most).
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  group: catalog-cartespleinair
  cancel-in-progress: false

# Least privilege: the job states what it needs.
permissions: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push the catalog/cartes-plein-air branch
      pull-requests: write # open or refresh its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Crawl cartespleinair.org
        run: npx tsx scripts/catalog/fetch-cartespleinair.ts --summary "$RUNNER_TEMP/summary.md"

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: catalog/cartes-plein-air
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES="scripts/catalog/fragments/cartes-plein-air.json scripts/catalog/sources/cartespleinair-rivers.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- $FILES)" ]; then
            echo "No change on cartespleinair.org since the last crawl."
            exit 0
          fi
          BOT_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          OPEN=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$OPEN" = OPEN ]; then
            # A person's commit on the PR (a fix made in review) must not be force-pushed away.
            HUMAN=$(gh pr view "$BRANCH" --json commits \
              --jq "[.commits[].authors[] | select(.email != \"$BOT_EMAIL\")] | length")
            if [ "$HUMAN" != 0 ]; then
              echo "::warning::$BRANCH has $HUMAN commit author(s) other than the bot: not overwriting it. Merge or close the PR; the next crawl brings the rest."
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email "$BOT_EMAIL"
          git switch -C "$BRANCH"
          git add -- $FILES
          git commit -m "Catalog: Cartes Plein-air weekly crawl" -m "Generated by $RUN_URL" -m "Refs #680"
          # The checkout kept no credential: the token goes to this push only.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          {
            echo "Weekly crawl of https://cartespleinair.org/cartes ($RUN_URL)."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "After merging, publish with \`npx tsx scripts/catalog/build-manifest.ts\` (docs/CATALOG.md §4)."
            echo "CI does not start on a PR opened by Actions: close and reopen it to run CI."
          } > "$RUNNER_TEMP/body.md"
          if [ "$OPEN" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Catalog: Cartes Plein-air weekly crawl" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
