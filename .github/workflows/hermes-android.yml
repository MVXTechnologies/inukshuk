name: Patched Hermes (Android)

# Builds com.facebook.hermes:hermes-android with the GWP-ASan fiber fix (#648)
# and publishes it once, as the assets of a GitHub release that the Android
# build consumes (plugins/withPatchedHermes.js, pinned by SHA-256 in
# plugins/patched-hermes/artifact.json). See docs/CI.md › Patched Hermes.
#
# - Source: facebook/hermes at the exact commit React Native pins
#   (plugins/patched-hermes/build.json), plus the patches listed there.
# - Build: Hermes's own Android Gradle project, the task Meta's release
#   workflow runs (build-android.yml at that commit: publish to
#   /tmp/maven-local), with the NDK/CMake/build-tools of that commit's version
#   catalog, installed up front (no SDK downloads inside Gradle).
# - Checks: every 64-bit libhermesvm.so of every variant carries the patched
#   make_fcontext, and Meta's prebuilt from Maven Central does not (so the
#   check is known to be able to fail).
# - Publish (push / manual only, never on a pull request): only when the
#   release tag does not exist yet. A published release is never replaced;
#   when it exists, its assets' digests are checked against artifact.json.
#   Builds are not bit-reproducible, so a rebuild proves the recipe, while
#   the published bytes stay the pinned ones.
#
# Runs only when its inputs change (it takes over an hour), on push rather than
# pull_request: a pull_request path filter matches the whole PR diff, so every
# later push of the PR would rebuild.
on:
  push:
    paths:
      - 'plugins/patched-hermes/build.json'
      - 'plugins/patched-hermes/*.patch'
      - 'plugins/patched-hermes/elf.js'
      - 'plugins/patched-hermes/hermesCheck.js'
      - 'plugins/patched-hermes/verify-hermes.js'
      - 'plugins/patched-hermes/artifact-manifest.js'
      - '.github/workflows/hermes-android.yml'
  workflow_dispatch:

concurrency:
  group: hermes-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build patched hermes-android
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Hermes's build-logic (HermesUtilsPlugin) requires it: the Hermes
      # checkout, as in facebook/hermes's build-android.yml.
      HERMES_WS_DIR: ${{ github.workspace }}/hermes-src
    outputs:
      release-tag: ${{ steps.inputs.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build inputs
        id: inputs
        run: |
          node -e '
            const b = require("./plugins/patched-hermes/build.json");
            const out = [
              `commit=${b.commit}`, `version=${b.version}`, `release-tag=${b.releaseTag}`,
              `ndk=${b.toolchain.ndk}`, `cmake=${b.toolchain.cmake}`,
              `build-tools=${b.toolchain.buildTools}`, `platform=${b.toolchain.platform}`,
            ];
            console.log(out.join("\n"));
          ' | tee -a "$GITHUB_OUTPUT"

      # Hermes's LTO builds of 3 variants x 4 ABIs need far more than the
      # runner's free disk (see native-build.yml).
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Check out Hermes at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: facebook/hermes
          ref: ${{ steps.inputs.outputs.commit }}
          path: hermes-src
          persist-credentials: false

      - name: Verify the source and apply the patches
        env:
          COMMIT: ${{ steps.inputs.outputs.commit }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git -C hermes-src rev-parse HEAD)" = "$COMMIT"
          actual=$(node -p 'require("./hermes-src/npm/hermes-compiler/package.json").version')
          [ "$actual" = "$VERSION" ] || { echo "::error::Hermes at $COMMIT is $actual, build.json says $VERSION"; exit 1; }
          node -e '
            const b = require("./plugins/patched-hermes/build.json");
            for (const p of b.patches) console.log(`${p.sha256}  plugins/patched-hermes/${p.file}`);
          ' > patches.sha256
          sha256sum -c patches.sha256
          while read -r _ patch; do
            git -C hermes-src apply --check "$GITHUB_WORKSPACE/$patch"
            git -C hermes-src apply "$GITHUB_WORKSPACE/$patch"
            echo "applied $patch"
          done < patches.sha256
          git -C hermes-src diff --stat

      - name: Install Android SDK components (bounded retry)
        env:
          NDK: ${{ steps.inputs.outputs.ndk }}
          CMAKE: ${{ steps.inputs.outputs.cmake }}
          BUILD_TOOLS: ${{ steps.inputs.outputs.build-tools }}
          PLATFORM: ${{ steps.inputs.outputs.platform }}
        run: node scripts/ci/android-sdk.mjs install "ndk;$NDK" "cmake;$CMAKE" "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM"

      # Host hermesc (it compiles Hermes's internal bytecode into the VM) links
      # ICU on Linux, like facebook/hermes's build-hermesc-linux.yml.
      - name: Install host build packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libicu-dev

      # What Meta's release script (utils/scripts/hermes/set-artifacts-version.js
      # --build-type release) does: VERSION_NAME = npm/hermes-compiler's
      # version, already checked to equal build.json's. Done directly: the
      # script needs the Hermes repo's whole yarn install (shelljs) for a
      # one-line edit.
      - name: Set the artifact version
        working-directory: hermes-src
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$VERSION/" android/gradle.properties
          grep -x "VERSION_NAME=$VERSION" android/gradle.properties

      # The steps are split so their durations are the build-from-source cost
      # per app build: hermesc once, then one variant for all four ABIs (what a
      # store build would compile every time).
      - name: Build hermesc (host)
        working-directory: hermes-src/android
        run: ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :buildHermesC

      - name: Build the release variant (4 ABIs)
        working-directory: hermes-src/android
        run: ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :assembleRelease

      - name: Build every variant and publish to /tmp/maven-local
        working-directory: hermes-src/android
        run: ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :publishAllPublicationsToMavenTempLocalRepository

      - name: Check the fix is in every library (and not in Meta's prebuilt)
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          maven="/tmp/maven-local/com/facebook/hermes/hermes-android/$VERSION"
          ls -la "$maven"
          mkdir -p "$RUNNER_TEMP/libs"
          for aar in "$maven"/*.aar; do
            dest="$RUNNER_TEMP/libs/$(basename "$aar" .aar)"
            unzip -q -o "$aar" 'jni/*' 'prefab/*' -d "$dest"
          done
          node plugins/patched-hermes/verify-hermes.js expect-patched "$RUNNER_TEMP/libs"

          # Negative control: the same check on Meta's release AAR must fail.
          official="$RUNNER_TEMP/official"
          mkdir -p "$official"
          url="https://repo1.maven.org/maven2/com/facebook/hermes/hermes-android/$VERSION/hermes-android-$VERSION-release.aar"
          curl -fsSL --retry 3 --retry-all-errors -o "$official/release.aar" "$url"
          curl -fsSL --retry 3 --retry-all-errors -o "$official/release.aar.sha256" "$url.sha256"
          echo "$(cat "$official/release.aar.sha256")  $official/release.aar" | sha256sum -c
          unzip -q -o "$official/release.aar" 'jni/*' -d "$official/x"
          node plugins/patched-hermes/verify-hermes.js expect-unpatched "$official/x"

          # Size: the packaged (stripped, jni/) library, ours vs Meta's.
          node -e '
            const { readFileSync } = require("node:fs");
            const { findLibs } = require("./plugins/patched-hermes/verify-hermes");
            const { describeLib } = require("./plugins/patched-hermes/hermesCheck");
            const pick = (dir) => Object.fromEntries(findLibs(dir).filter((p) => p.includes("/jni/"))
              .map((p) => { const i = describeLib(readFileSync(p)); return [i.abi, i]; }));
            const ours = pick(process.argv[1] + "/hermes-android-" + process.argv[3] + "-release");
            const meta = pick(process.argv[2]);
            const rows = Object.keys(meta).sort().map((abi) =>
              `| ${abi} | ${meta[abi].size} | ${ours[abi]?.size} | ${(ours[abi]?.size ?? 0) - meta[abi].size} | ${ours[abi]?.fcontext} |`);
            console.log(["### libhermesvm.so (release, packaged copy)", "",
              "| ABI | Meta prebuilt (bytes) | patched (bytes) | delta | make_fcontext |",
              "| --- | --- | --- | --- | --- |", ...rows].join("\n"));
          ' "$RUNNER_TEMP/libs" "$official/x" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write artifact.json
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          maven="/tmp/maven-local/com/facebook/hermes/hermes-android/$VERSION"
          mkdir -p "$RUNNER_TEMP/out"
          node plugins/patched-hermes/artifact-manifest.js "$maven" "$RUNNER_TEMP/libs" \
            "$GITHUB_REPOSITORY" "$RUN_URL" > "$RUNNER_TEMP/out/artifact.json"
          cat "$RUNNER_TEMP/out/artifact.json"
          for f in "$maven"/*; do
            case "$f" in *.aar|*.jar|*.module|*.pom) cp "$f" "$RUNNER_TEMP/out/" ;; esac
          done
          { echo '### artifact.json'; echo; echo '```json'; cat "$RUNNER_TEMP/out/artifact.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-android-patched
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish (once per release tag)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-android-patched
          path: out

      - name: Publish, or check the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release-tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published; its assets are never replaced."
            # The committed pin must describe what is published.
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[] | "\(.name) \(.size) \(.digest // "")"' > published.txt
            node -e '
              const pinned = require("./plugins/patched-hermes/artifact.json");
              if (pinned.releaseTag !== process.env.TAG || !pinned.files.length) {
                console.log("::notice::artifact.json does not pin " + process.env.TAG + " yet; nothing to compare.");
                process.exit(0);
              }
              const pub = new Map(require("node:fs").readFileSync("published.txt", "utf8").trim().split("\n")
                .map((l) => l.split(" ")).map(([n, s, d]) => [n, { size: Number(s), digest: d }]));
              let bad = 0;
              for (const f of pinned.files) {
                const p = pub.get(f.name);
                const ok = p && p.size === f.size && (!p.digest || p.digest === "sha256:" + f.sha256);
                console.log(`${ok ? "ok " : "BAD"} ${f.name}`);
                if (!ok) bad++;
              }
              if (bad) { console.log("::error::published assets differ from artifact.json"); process.exit(1); }
            '
            exit 0
          fi
          {
            echo "Patched \`com.facebook.hermes:hermes-android\` for Inukshuk's Android build (#648). **Not an app release.**"
            echo
            echo "facebook/hermes \`$(node -p 'require("./plugins/patched-hermes/build.json").commit')\` (the Hermes React Native pins) + the boost.context frame-pointer fix from facebook/hermes 73f9af39b1, so GWP-ASan's frame-pointer walk stops at a Hermes fiber's first frame."
            echo
            echo "Built by $RUN_URL. Consumed by plugins/withPatchedHermes.js, pinned by SHA-256 in plugins/patched-hermes/artifact.json:"
            echo
            echo '```json'
            cat out/artifact.json
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Patched Hermes for Android ($TAG)" --notes-file notes.md \
            out/*.aar out/*.jar out/*.module out/*.pom
