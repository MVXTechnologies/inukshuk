name: E2E (Maestro · Android)

# End-to-end flows on real Android emulators. One job builds a release APK;
# the flows then run in parallel SHARDS (.maestro/shards.json), each on its
# own freshly booted emulator. Nightly + on demand to conserve CI minutes.
#
# Sharded (2026-10-06) because the single serial job outgrew its 60-minute
# timeout: ~25 min of APK build plus 14+ flows back to back. Now the build
# runs once and the slowest shard bounds the rest. State never crosses
# shards, so flows that need another flow's output (a recorded trail) share
# its shard — scripts/ci/e2eShards.test.mjs checks the plan, and that every
# flow in .maestro/ is either in a shard or explicitly parked.
#
# The APK must be a RELEASE build: debug builds don't embed a JS bundle, and the
# app ships expo-dev-client, so a debug APK in CI (no Metro) boots into the
# dev-launcher "connect to a development server" screen — no assertion on real
# UI can ever pass. The prebuild template signs release with the debug keystore,
# so no signing secrets are needed.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Shards to run (comma-separated, see .maestro/shards.json), or all
        type: string
        default: all
  schedule:
    - cron: '15 5 * * *'

# The event is in the group: a manual dispatch on main used to cancel the
# nightly scheduled run (2026-10-06), which then reported nothing.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The matrix comes from the plan file, so adding a shard is a one-file
      # change. Validated here first: a broken plan fails in seconds, before
      # the 20-minute build.
      - name: Read the shard plan
        id: plan
        env:
          ONLY: ${{ inputs.shards || 'all' }}
        run: |
          node scripts/ci/e2e-shards.mjs check
          echo "shards=$(node scripts/ci/e2e-shards.mjs names "$ONLY")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Same lockfile-keyed Gradle cache as native-build.yml — ~/.gradle exists
      # independently of the prebuild-generated android/ dir (setup-java's
      # `cache: gradle` variant hard-fails here, see #77). Restored on every
      # run, saved only from main after a successful build (see
      # native-build.yml for why branches no longer save it).
      - name: Restore Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # The NDKs, CMake, platform and build-tools Gradle needs, installed up
      # front with a bounded, logged retry; Gradle may not download any itself
      # (-Pandroid.builder.sdkDownload=false). See native-build.yml.
      - name: Resolve Android SDK components
        id: sdk
        run: node scripts/ci/android-sdk.mjs outputs >> "$GITHUB_OUTPUT"

      - name: Restore Android NDK + CMake
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.paths }}
          key: ${{ steps.sdk.outputs.key }}

      - name: Install Android SDK components (bounded retry)
        run: node scripts/ci/android-sdk.mjs install

      - name: Save Android NDK + CMake (main only)
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.paths }}
          key: ${{ steps.sdk.outputs.key }}

      # Convert's PROJ static libs, x86_64 only like the APK below.
      - name: Cache PROJ build (Convert)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            modules/inukshuk-proj/prebuilt
            modules/inukshuk-proj/assets
          key: proj-android-x86_64-${{ runner.os }}-${{ hashFiles('modules/inukshuk-proj/scripts/*.sh') }}

      - name: Build PROJ for Android x86_64 (Convert)
        run: npm run proj:prepare -- android
        env:
          ANDROID_ABIS: x86_64

      # x86_64 only: the emulator is x86_64, and a single-ABI APK cuts both the
      # native build and the ~6-minute multi-ABI adb install.
      - name: Prebuild + assemble release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 -Pandroid.builder.sdkDownload=false
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          # Point the map store at the loopback fixture catalog served by
          # e2e-attempts.sh (adb reverse tcp:8787) — CI must never hit NRCan.
          CATALOG_MANIFEST_URL: http://127.0.0.1:8787/index.json
          # The simulated GNSS receiver (#588) for .maestro/gnss.yaml: E2E builds only,
          # never a store build (src/data/gnss/link.ts).
          EXPO_PUBLIC_GNSS_FAKE: '1'

      - name: Save Gradle dependencies (main only)
        if: steps.gradle-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error

  flows:
    name: Flows (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    # The slowest shard runs ~15 min of flows (+ one retry of a flaky flow)
    # after ~5 min of setup and boot; 35 leaves room for that without letting
    # a hung emulator burn an hour.
    timeout-minutes: 35
    strategy:
      # Every shard reports: one red shard must not hide the others' results.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without this the emulator runs pure-software emulation: boot takes
      # ~6.5 min and the Android system process itself ANRs under load ("Process
      # system isn't responding" over the app at launch), failing any UI assert.
      # Linux runners have /dev/kvm but it isn't accessible by default.
      - name: Enable KVM group perms (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Node deps for the runner: the fixture catalog generator (tsx) and the
      # pdf-overlays pixel check (upng-js).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Maestro's CLI runs on the JVM.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-apk
          path: e2e-apk

      # Pinned: an unpinned installer takes whatever Maestro released last
      # night, so a CLI change could turn every shard red with no change of
      # ours. Bump deliberately (and re-run every shard) when upgrading. The
      # installer is downloaded to a file first, so a truncated download can
      # never run as a partial script; only that download is retried.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/install-maestro.sh" https://get.maestro.mobile.dev \
              && bash "$RUNNER_TEMP/install-maestro.sh"; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::Maestro install failed 3 times"; exit 1; }
            echo "::warning title=Maestro install retried::attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the shard's flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # The Maestro Android driver installs an instrumentation APK and connects
          # over a dadb port; on a cold CI emulator that handshake routinely exceeds
          # Maestro's default startup window and throws AndroidDriverTimeoutException
          # before any flow runs. Give it room.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
          # The shard name comes from the dispatch input (via the plan): read
          # it from env, never paste ${{ }} into the script.
          SHARD: ${{ matrix.shard }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # google_apis, not AOSP: the default image has no fused/network
          # location provider, so expo-location's watch throws "location
          # services are disabled" even with services enabled — the app then
          # shows its 'Location is turned off' banner and every GPS-dependent
          # flow no-ops (waypoint drops, recordings).
          target: google_apis
          # Headless, software GPU, no snapshots/boot-anim — the stable combo for
          # ubuntu-latest CI emulators (avoids GPU/snapshot races at boot).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            # Wait until the system is fully booted before letting Maestro attach,
            # otherwise the driver races package-manager readiness.
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            # Kill animations so Maestro's element waits don't flake on transitions.
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Never render ANR/crash dialogs. The google_apis image's post-boot
            # GMS churn ANRs Pixel Launcher on this software-GPU runner often
            # enough that a "Pixel Launcher isn't responding" dialog sat above
            # the app in the a11y tree and failed EVERY flow's first assert on
            # 6 of the 7 red nightlies between 07-25 and 08-02.
            adb shell settings put global hide_error_dialogs 1
            # Pre-acknowledge Android's "Viewing full screen — swipe down from
            # the top to exit" cling. Since 2.0.0 the app hides the system
            # navigation bar (useAndroidImmersive / expo-navigation-bar), and
            # on a fresh device the OS draws that cling across the top third
            # of the screen until someone taps "Got it". No flow does, so it
            # came back on every launch, covered the Map's top-right control
            # rail and failed EVERY flow's first assert ("Map actions" is
            # visible) on every nightly from 09-29 to 10-05. "confirmed" is the
            # value the OS itself stores when "Got it" is tapped.
            adb shell settings put secure immersive_mode_confirmations confirmed
            echo "immersive_mode_confirmations=$(adb shell settings get secure immersive_mode_confirmations)"
            # Location SERVICES must be on or Maestro's setLocation feeds a fix
            # the OS never delivers: the app shows "Location is turned off",
            # waypoint drops no-op and recording captures zero points — the
            # exact nightly failure cascade (waypoint → category-record → every
            # fixture-dependent flow).
            adb shell cmd location set-location-enabled true
            # Belt-and-braces: the legacy secure settings some services still
            # read. 3 = HIGH_ACCURACY. All harmless where ignored.
            adb shell settings put secure location_mode 3
            adb shell settings put secure location_providers_allowed +gps || true
            adb shell settings put secure location_providers_allowed +network || true
            # Let system_server finish its post-boot work before loading it
            # further — installing + launching immediately after boot is what
            # tipped the (previously unaccelerated) system process into ANR.
            sleep 20
            adb install -r e2e-apk/app-release.apk
            bash .github/scripts/e2e-attempts.sh "$SHARD"

      # Review screenshots: flows save `takeScreenshot: review-<name>` for UI a
      # PR needs to show (light + dark) without a local device. Uploaded on
      # green runs too; where the file lands depends on the Maestro CLI
      # version (see scripts/e2e/find-screenshot.sh), so look in all three.
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-screenshots-${{ matrix.shard }}
          path: |
            ~/.maestro/tests/**/review-*.png
            .maestro/**/review-*.png
            review-*.png
          if-no-files-found: ignore
          retention-days: 14

      # Maestro writes screenshots + the UI hierarchy on failure; without this
      # upload every red run is a black box. Also uploaded for a green shard
      # that needed a retry (its first failure's logcat is the flake evidence).
      - name: Upload Maestro debug artifacts
        if: failure() || hashFiles('logcat-failure-*.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-debug-${{ matrix.shard }}
          path: |
            ~/.maestro/tests
            logcat-failure-*.txt
          retention-days: 7
