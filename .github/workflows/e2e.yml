name: E2E (Maestro · Android)

# End-to-end smoke test on a real Android emulator. Builds a release APK, boots
# an emulator with hardware acceleration, installs the app, and runs the Maestro
# flow in .maestro/. Nightly + on demand to conserve CI minutes.
#
# The APK must be a RELEASE build: debug builds don't embed a JS bundle, and the
# app ships expo-dev-client, so a debug APK in CI (no Metro) boots into the
# dev-launcher "connect to a development server" screen — no assertion on real
# UI can ever pass. The prebuild template signs release with the debug keystore,
# so no signing secrets are needed.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Without this the emulator runs pure-software emulation: boot takes
      # ~6.5 min and the Android system process itself ANRs under load ("Process
      # system isn't responding" over the app at launch), failing any UI assert.
      # Linux runners have /dev/kvm but it isn't accessible by default.
      - name: Enable KVM group perms (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      # Same lockfile-keyed Gradle cache as native-build.yml — ~/.gradle exists
      # independently of the prebuild-generated android/ dir (setup-java's
      # `cache: gradle` variant hard-fails here, see #77).
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # x86_64 only: the emulator is x86_64, and a single-ABI APK cuts both the
      # native build and the ~6-minute multi-ABI adb install.
      - name: Prebuild + assemble release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The Maestro Android driver installs an instrumentation APK and connects
          # over a dadb port; on a cold CI emulator that handshake routinely exceeds
          # Maestro's default startup window and throws AndroidDriverTimeoutException
          # before any flow runs. Give it room.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # Headless, software GPU, no snapshots/boot-anim — the stable combo for
          # ubuntu-latest CI emulators (avoids GPU/snapshot races at boot).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            # Wait until the system is fully booted before letting Maestro attach,
            # otherwise the driver races package-manager readiness.
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            # Kill animations so Maestro's element waits don't flake on transitions.
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Location SERVICES must be on or Maestro's setLocation feeds a fix
            # the OS never delivers: the app shows "Location is turned off",
            # waypoint drops no-op and recording captures zero points — the
            # exact nightly failure cascade (waypoint → category-record → every
            # fixture-dependent flow).
            adb shell cmd location set-location-enabled true
            # Belt-and-braces: the legacy secure setting some services still
            # read. 3 = HIGH_ACCURACY. Harmless where ignored.
            adb shell settings put secure location_mode 3
            # Let system_server finish its post-boot work before loading it
            # further — installing + launching immediately after boot is what
            # tipped the (previously unaccelerated) system process into ANR.
            sleep 20
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            bash .github/scripts/e2e-attempts.sh

      # Maestro writes screenshots + the UI hierarchy on failure; without this
      # upload every red run is a black box.
      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests
            logcat-failure-*.txt
          retention-days: 7
