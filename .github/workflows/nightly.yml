name: Nightly Health Check

# Autonomous self-checkup. Runs the full gate plus a blocking expo-doctor and a
# security audit every night. If anything regresses (e.g. a transitive dep
# breaks, or a new SDK surfaces a config warning), it opens/updates a tracking
# issue so problems surface without anyone watching.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Lint
        id: lint
        run: npm run lint
      - name: Tests
        id: tests
        run: npm run test:ci
      - name: CI script tests
        id: scripts
        run: npm run test:scripts
      # Not raw `expo-doctor`: one known finding (the SDK 56 Hermes V1 memory
      # regression, fixable only by the SDK 57 upgrade) made this red every
      # night, which hid every other check. The gate applies the dated
      # acknowledgements in expo-doctor-acknowledged.jsonc and still fails on
      # anything unacknowledged, expired, or since fixed (#338).
      - name: Expo Doctor (blocking, acknowledgements in expo-doctor-acknowledged.jsonc)
        id: doctor
        run: node scripts/ci/expo-doctor-gate.mjs
      # audit-ci instead of raw `npm audit`: same high+ threshold, but accepted
      # advisories can be allowlisted (with reasons and exit plans) in
      # audit-ci.jsonc instead of failing the gate every night.
      - name: Security audit (high+, allowlist in audit-ci.jsonc)
        id: audit
        run: npx audit-ci@^7 --config ./audit-ci.jsonc

  report-failure:
    needs: health
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      checks: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '🩺 Nightly health check failed';
            // Name the step that failed: "one of five things broke" is not
            // something anyone can act on at 05:00 (#338). Read from the API
            // rather than job outputs, which a failed job does not publish.
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.jobs
              .flatMap((job) => job.steps ?? [])
              .filter((step) => step.conclusion === 'failure')
              .map((step) => step.name);
            const which = failed.length > 0 ? failed.join(', ') : 'an unreported step';
            // ...and what the failing steps said about it: their error
            // annotations, e.g. the expo-doctor gate's unacknowledged check
            // and its one-line remedy. A job's id is its check-run id. Best
            // effort — the issue is still filed if this read fails.
            const details = [];
            for (const job of jobs.jobs.filter((j) => j.conclusion === 'failure')) {
              try {
                const { data: annotations } = await github.rest.checks.listAnnotations({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: job.id,
                });
                // Skip the runner's own "Process completed with exit code 1.".
                const said = annotations.filter(
                  (a) => a.annotation_level === 'failure' && !a.message.startsWith('Process completed'),
                );
                for (const a of said) details.push(`- ${a.message}`);
              } catch (err) {
                core.warning(`Could not read annotations of ${job.name}: ${err.message}`);
              }
            }
            const body = `The nightly health check failed on ${new Date().toISOString().slice(0, 10)}.\n\n` +
              `**Failed: ${which}**\n\n` +
              // Capped: a tsc or eslint problem matcher can raise dozens.
              (details.length > 0 ? `${details.slice(0, 10).join('\n')}\n\n` : '') +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-check'],
              });
            }
