name: Nightly Health Check

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npm run check
      - run: node --test scripts/ci/*.test.mjs

  doctor:
    name: Expo runtime health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes expo-doctor@1.20.4

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit (high+, documented allowlist)
        run: npx --yes audit-ci@7.1.0 --config ./audit-ci.jsonc

  report-failure:
    needs: [quality, doctor, security]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const title = '🩺 Nightly health check failed';
            const results = JSON.parse(process.env.RESULTS);
            const rows = Object.entries(results).map(([name, value]) => `- ${name}: ${value.result}`).join('\n');
            const body = `Latest check: ${new Date().toISOString().slice(0, 10)}\n\n${rows}\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              'Code quality, native runtime health, and dependency security run independently. A runtime warning must be fixed in the app, not hidden in CI.';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'health-check', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['health-check'] });
            }
