# Team tasks demo (#589): the live simulation, iOS simulator, loopback build
# (EXPO_PUBLIC_MESH_LOOPBACK=1) seeded with seed-team-demo.sh:
# create a team → Alex (Guide) joins → share the Mont-Sainte-Anne trail with
# its photos → Alex comments on the summit photo → the system notification
# appears → tap it → the photo with Alex's comment. Screenshots on the way.
appId: com.inukshuk.app
---
- launchApp:
    permissions:
      location: always
      notifications: allow
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- setLocation:
    latitude: 47.0745
    longitude: -70.9065
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: '.*Team mode.*'
          commands:
            - tapOn: 'Extensions.*'
      - scrollUntilVisible:
          element: '.*Team mode.*'
          direction: DOWN
          timeout: 5000
# Compact list (#633): a one-line row, Get before the install and its switch
# after; the team rows are in its details, opened by tapping the row (only
# when they are closed: a second tap would close them again).
- scrollUntilVisible:
    element:
      id: 'extension-row-team'
    direction: DOWN
- runFlow:
    when:
      visible: 'Get Team mode'
    commands:
      - tapOn: 'Get Team mode'
- runFlow:
    when:
      notVisible:
        id: 'extension-details-team'
    commands:
      - tapOn:
          id: 'extension-row-team'
- scrollUntilVisible:
    element:
      id: 'team-create-row'
    direction: DOWN
- tapOn:
    id: 'team-create-row'
- tapOn:
    id: 'team-create-name'
- inputText: 'Sortie Mont-Sainte-Anne'
- tapOn:
    id: 'team-create-myname'
- eraseText: 40
- inputText: 'Marc-André'
- hideKeyboard
- tapOn:
    id: 'team-create-ends-3d'
- tapOn:
    id: 'team-create-submit'
# The first team makes this phone's keys (noble on Hermes: a few seconds),
# then iOS asks for notifications once.
- extendedWaitUntil:
    visible: '(Allow|Sortie Mont-Sainte-Anne)'
    timeout: 40000
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 15000
# The live simulation at x5: Alex (Guide), Julie Tremblay and Sam join.
- scrollUntilVisible:
    element:
      id: 'team-sim-row'
    direction: DOWN
- tapOn:
    id: 'team-sim-row'
- scrollUntilVisible:
    element:
      id: 'team-sim-start'
    direction: DOWN
- tapOn:
    id: 'team-sim-speed-5'
- tapOn:
    id: 'team-sim-start'
- scrollUntilVisible:
    element:
      id: 'team-member-Sam'
    direction: UP
    timeout: 120000
- takeScreenshot: 01-simulation
# Share the trail with its photos.
- scrollUntilVisible:
    element:
      id: 'team-shares-row'
    direction: DOWN
- tapOn:
    id: 'team-shares-row'
- tapOn:
    id: 'team-share-pick-trail'
- tapOn: '.*Mont-Sainte-Anne · sentier du sommet.*'
- extendedWaitUntil:
    visible: '.*Trail and 7 photos shared with the team.*'
    timeout: 20000
- tapOn: 'OK'
- tapOn: 'Back'
# The map: the team walking, Alex's pin off the trail, photo bubbles.
- tapOn: 'Back'
- tapOn: 'Back'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Superbe vue au sommet.*'
    timeout: 60000
- takeScreenshot: 02-comment-alert
- extendedWaitUntil:
    visible:
      id: 'team-map-pin'
    timeout: 60000
- takeScreenshot: 03-map-pin-bubbles
# Open the summit photo from the alert, and give Alex a task there.
- runFlow:
    when:
      visible:
        id: 'team-alert-banner'
    commands:
      - tapOn:
          id: 'team-alert-banner'
- runFlow:
    when:
      notVisible:
        id: 'photo-viewer'
    commands:
      - tapOn:
          point: '16%,44%'
- extendedWaitUntil:
    visible:
      id: 'photo-team-comments'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'team-comment-input'
    direction: DOWN
- tapOn:
    id: 'team-comment-input'
- inputText: '+task @Alex flag the detour with ribbons'
- tapOn:
    id: 'team-comment-send'
- extendedWaitUntil:
    visible:
      id: 'team-task-chip'
    timeout: 10000
- takeScreenshot: 04-task-chip
- extendedWaitUntil:
    visible: '.*(OK, j’y vais|On it!|Parfait, je m’en occupe|Reçu, j’arrive).*'
    timeout: 60000
- takeScreenshot: 05-alex-on-it
- extendedWaitUntil:
    visible: '.*(Fait ✔|Done ✔).*'
    timeout: 90000
- takeScreenshot: 06-alex-done
- tapOn: 'Close'
- openLink: 'inukshuk://team/tasks'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'team-tasks-screen'
    timeout: 10000
- tapOn:
    id: 'team-task-filter-done'
- takeScreenshot: 07-tasks-done
