# Cloudflare Worker serving the vector base map from R2 (see ../README.md).
name = "inukshuk-tiles"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Bind to tiles.mvxtechnologies.com once the zone is on Cloudflare:
# routes = [{ pattern = "tiles.mvxtechnologies.com", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "inukshuk-tiles"

[vars]
ALLOWED_ORIGINS = "*"
CACHE_CONTROL = "public, max-age=86400"
# DEM tiles one contour request may decode itself (src/contourGrid.ts). 2 keeps
# an uncached tile near the free plan's 10 ms of CPU; a tile that needed more
# is answered partial (X-Contour-Source: partial, cached 15 s, not stored).
# On the Workers Paid plan set "9": every tile is full on its first request.
CONTOUR_DECODE_BUDGET = "2"
# Strava API app (public id; the secret is `wrangler secret put STRAVA_CLIENT_SECRET`).
STRAVA_CLIENT_ID = "283079"
# Place search (GET /search, src/search.ts): the Photon /api endpoint it proxies.
# Point at a self-hosted Photon (e.g. on the NAS) to leave the public instance.
PHOTON_URL = "https://photon.komoot.io/api/"
SEARCH_CACHE_CONTROL = "public, max-age=86400"
SEARCH_RATE_PER_MIN = "60"
# Photon osm_tag filters on every query: shops, offices and workshops never take a slot.
PHOTON_OSM_TAGS = "!shop,!office,!craft"
# "0" = one upstream query per search (no summit/water variants, see src/searchPlan.ts).
PHOTON_VARIANTS = "1"
# "I already donated" code email (#476). Secrets: `wrangler secret put
# RESEND_API_KEY` and `wrangler secret put DONOR_VERIFY_SALT` (any long random
# string); without both, /donor-verify/* answers 404.
VERIFY_FROM = "Inukshuk <no-reply@mvxtechnologies.com>"
# Route snapping (POST /route, src/route.ts). Each mode picks an engine
# ("brouter" or "valhalla"); point the URLs at the NAS router to leave the
# public instances — no app update needed.
TRAIL_ENGINE = "brouter"
ROAD_ENGINE = "valhalla"
BROUTER_URL = "https://brouter.de/brouter"
VALHALLA_URL = "https://valhalla1.openstreetmap.de"
ROUTE_CACHE_CONTROL = "public, max-age=604800"
ROUTE_RATE_PER_MIN = "30"
# FOSSGIS allows at most one request per second: pace each engine per isolate.
ROUTE_UPSTREAM_INTERVAL_MS = "1000"

# Abuse/cost guards (src/guards.ts, security audit 2026-10). Archives served as
# /{archive}/… (default: basemap, peaks, parks, geodetic, tides, crags) —
# list them here to add one without a code change:
# ARCHIVES = "basemap,peaks,parks,geodetic,tides,crags"
# Contour tiles one client may GENERATE per minute (R2 misses only), floor per
# isolate; the CONTOUR_LIMITER binding below is the real limit.
CONTOUR_GEN_PER_MIN = "300"
# Code emails /donor-verify/start may send per UTC day, all addresses
# together. Keep it under the Resend plan's daily quota (free: 100/day).
VERIFY_DAILY_SEND_CAP = "90"

# Rate-limiting bindings (per client IP, counted per Cloudflare location; free
# on every plan). Each route also keeps a per-isolate floor, so a missing
# binding degrades to that floor instead of no limit. namespace_id is any
# integer unique within the account.

# /search: cache misses only (answers come from the edge cache first).
[[ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# /route: cache misses only.
[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

# /contours: tiles GENERATED (R2 miss) per client per minute. Offline packs
# downloading a fresh region get 429 + Retry-After past this and resume.
[[ratelimits]]
name = "CONTOUR_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 300
  period = 60

# /strava/token|refresh: a phone needs one exchange and a refresh every ~6 h.
[[ratelimits]]
name = "STRAVA_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 10
  period = 60

# POST /donors (#476): at most 3 donor-name submissions per client IP per
# minute, on top of the per-isolate hourly cap in src/donors.ts. The IP is the
# limiter key only; it is never stored.
[[ratelimits]]
name = "DONOR_LIMITER"
namespace_id = "1476"

  [ratelimits.simple]
  limit = 3
  period = 60
