# Cloudflare Worker serving the vector base map from R2 (see ../README.md).
name = "inukshuk-tiles"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Bind to tiles.mvxtechnologies.com once the zone is on Cloudflare:
# routes = [{ pattern = "tiles.mvxtechnologies.com", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "inukshuk-tiles"

[vars]
ALLOWED_ORIGINS = "*"
CACHE_CONTROL = "public, max-age=86400"
# Strava API app (public id; the secret is `wrangler secret put STRAVA_CLIENT_SECRET`).
STRAVA_CLIENT_ID = "283079"
# Route snapping (POST /route, src/route.ts). Each mode picks an engine
# ("brouter" or "valhalla"); point the URLs at the NAS router to leave the
# public instances — no app update needed.
TRAIL_ENGINE = "brouter"
ROAD_ENGINE = "valhalla"
BROUTER_URL = "https://brouter.de/brouter"
VALHALLA_URL = "https://valhalla1.openstreetmap.de"
ROUTE_CACHE_CONTROL = "public, max-age=604800"
ROUTE_RATE_PER_MIN = "30"
# FOSSGIS allows at most one request per second: pace each engine per isolate.
ROUTE_UPSTREAM_INTERVAL_MS = "1000"

# Optional global rate limit for /route (otherwise a per-isolate counter):
# [[ratelimits]]
# name = "ROUTE_LIMITER"
# namespace_id = "1002"
# simple = { limit = 30, period = 60 }
