# ============================================================================
# PARKED — this flow CANNOT PASS on the shipping build, and that is correct.
#
# Marine chart mode is parked behind MARINE_ENABLED in
# src/core/features/flags.ts (owner call, 2026-09: the chart quality and the
# fetch/render speed do not meet the bar yet). The Marine row in the Overlays
# menu is present but DISABLED with a "Coming soon" subtitle and an unchecked
# box, so the toggle this flow taps does nothing.
#
# It is kept, not deleted, because flipping MARINE_ENABLED back to true must
# restore the feature AND its coverage in one step. Android CI never ran it —
# .github/scripts/e2e-attempts.sh has an explicit flow list and this file is
# not on it — so nothing in CI changes. To use it: set MARINE_ENABLED = true,
# rebuild, run.
# ============================================================================
# Marine overlays e2e (marine M3, reworked for the D-6 drill-down): since the
# drill-down amendment, Marine is a single all-or-nothing chart-mode toggle
# at the TOP LEVEL of the Overlays menu (no sub-menu, no per-layer rows —
# depth bands + seamarks drape together). Toggle it on, confirm the mandatory
# "Not for navigation" chip shows, long-press for the forecast/tides card and
# confirm the 2D map stays alive throughout, then toggle it back off.
# Crash-detection focus, like weather.yaml — NEVER asserts chart pixels or
# tide content.
#
# Portability notes:
# - Network-independent by design: in CI the NONNA WMS / OpenSeaMap hosts are
#   unreachable, tile fetches fail and the map degrades to the basemap it
#   already tolerates; the card's IWLS fetches fail and the Tides section
#   renders its "unavailable" line. Nothing below asserts any network pixels
#   — only menu state, the (purely local) disclaimer chip, and the crash gate.
# - 'Marine' is the toggle row's constant a11y label; it exists only while
#   the menu sheet is open, so it doubles as the open sentinel. The row is a
#   TOGGLE, so each retry pass flips it exactly once and the chip
#   wait afterwards verifies the resulting state — self-correcting whatever
#   state a previous run left behind (the heatmap.yaml checkbox idiom).
# - A far-left tap lands on the sheet's dismiss backdrop and only closes the
#   menu (see trail-view.yaml).
# - Wave D adds a tap-for-depth crash gate: the readout chip's depth line is
#   a live NONNA WCS query, so offline it simply never renders. Taps below
#   assert only the map's own chrome, never the chip or a depth number.
# - Wave D3/D4 add two more gates, both network-independent:
#   * the offline-pack BANNER. Whether it appears depends on the emulator's
#     location, zoom and the coverage ladder's verdict, so it is NEVER
#     asserted visible — it is only tapped WHEN visible, to prove that the
#     Surface (deliberately not a Portal/Dialog) and its snooze path don't
#     crash or soft-lock the map underneath.
#   * the Settings -> Data settings pack list, which is pure local UI: its
#     empty state and the auto-update switch must always render.
#   Both use wildcard matchers with a LEADING and TRAILING '.*' — iOS merges
#   a row's title and subtitle into one accessibility string.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# --- Marine chart mode ON (guarded toggle; chip = the state signal) ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Marine'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Marine'
          timeout: 10000
      - tapOn: 'Marine'
      - tapOn:
          point: 50%,8%
      - assertVisible: 'Map actions'
      # If a previous run left marine ON, that tap just turned it OFF — this
      # wait fails and the next pass flips it back on.
      - extendedWaitUntil:
          visible: 'Not for navigation'
          timeout: 5000
# The map beneath must still be responsive while (unreachable) tiles fail,
# and the mandatory disclaimer chip must be up — it's pure local UI, so this
# asserts fine with or without network.
- assertVisible: 'Map actions'
- assertVisible: 'Not for navigation'
# --- Forecast/tides card: with only the marine mode on (no weather layer),
# long-press must open/dismiss without ever crashing, network or not. ---
- longPressOn:
    point: 50%,40%
- assertVisible: 'Map actions'
- tapOn:
    point: 50%,30%
- assertVisible: 'Map actions'
# --- Tap-for-depth (wave D D1): a bare map tap in marine mode drops the
# readout chip and fires a NONNA WCS point query. Crash gate only — offline
# the query fails silently and the depth line never appears (the chip may not
# render at all), so nothing below asserts the chip or any depth text. The
# second tap lands on/near the first, exercising the chip dismiss path. ---
- tapOn:
    point: 50%,55%
- assertVisible: 'Map actions'
- tapOn:
    point: 50%,55%
- assertVisible: 'Map actions'
# The client-rendered chart drape mounts an image source + a soundings symbol
# layer on camera settle; a pan must survive that style rebuild.
- swipe:
    start: 50%,60%
    end: 50%,45%
- assertVisible: 'Map actions'
- assertVisible: 'Not for navigation'
# --- Offline marine pack banner (wave D §D4): a plain Surface row in the
# bottom stack, never a Portal (One UI touch-swallow). It only offers where
# the coverage ladder says a pack would beat what is on screen, so its
# presence is environment-dependent and must not be asserted. When it IS up,
# "Not now" snoozes the region for 30 days — tap it and prove the map is
# still alive and the chip is untouched. ---
- runFlow:
    when:
      visible: '.*Marine chart pack.*'
    commands:
      - assertVisible: 'Map actions'
      - tapOn: '.*Not now.*'
      - assertVisible: 'Map actions'
      - assertVisible: 'Not for navigation'
      # Snoozed: the banner must not immediately nag again after a pan.
      - swipe:
          start: 50%,55%
          end: 50%,45%
      - assertVisible: 'Map actions'
# --- The menu row reflects the active layers; turn everything back off so
# reruns and later flows start from the default map. ---
# --- Toggle marine back off so reruns and later flows start from the
# default map (same self-correcting idiom, inverted chip wait). ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Marine'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Marine'
          timeout: 10000
      - tapOn: 'Marine'
      - tapOn:
          point: 50%,8%
      - assertVisible: 'Map actions'
      - extendedWaitUntil:
          notVisible: 'Not for navigation'
          timeout: 5000
# Chip gone with the chart mode off.
- assertNotVisible: 'Not for navigation'

# --- Offline marine packs in Settings -> Data settings (wave D §D4): pure
# local UI, so this asserts for real. With no packs downloaded the section
# shows its empty state; the auto-update switch is always present. The row
# is NOT tapped — flipping it would change persisted behaviour for later
# flows, and deleting a pack needs one to exist. ---
- tapOn:
    text: 'Settings(, tab.*)?'
    retryTapIfNoChange: true
- assertVisible: '.*Data settings.*'
- scrollUntilVisible:
    element:
      text: '.*Data settings.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: '.*Offline maps.*'
          commands:
            - tapOn: '.*Data settings.*'
      - extendedWaitUntil:
          visible: '.*Offline maps.*'
          timeout: 5000
- scrollUntilVisible:
    element:
      text: '.*Offline marine packs.*'
    direction: DOWN
    centerElement: true
- assertVisible: '.*Offline marine packs.*'
- scrollUntilVisible:
    element:
      text: '.*Auto-update marine packs.*'
    direction: DOWN
- assertVisible: '.*Auto-update marine packs.*'
# Back to the map so reruns and later flows start where they expect to.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
