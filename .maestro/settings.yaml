# Settings walk e2e: opens each of the five collapsible categories (backlog
# item 4) and asserts its key rows — App settings (recording/display/map),
# Data settings (export row), Third party (Strava, #132), System settings
# (automatic error reporting + report queue, #110), System info (version).
#
# The AccordionGroup keeps ONE category open at a time: tapping the next
# header closes the previous one, so each category's assertions must finish
# before moving on, and scroll positions shift at every switch —
# scrollUntilVisible absorbs that.
#
# Deliberately does NOT tap "Download your data": it opens the OS share
# sheet, which on Android can trap Maestro outside the app. Presence-only.
# Same for the Strava row: without client credentials in the build it is
# disabled with subtitle "Strava is not configured in this build" — both the
# configured and unconfigured subtitles are accepted.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
# Wait for the map screen to fully mount before touching the tab bar — a tab
# tap fired mid-cold-start can be dropped while the hierarchy is churning.
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Settings(, tab.*)?'
    retryTapIfNoChange: true
# iOS merges a row's title + subtitle into ONE accessibility string (Android
# keeps them separate elements), so every row match below is a wildcard
# regex — it hits the title element on Android and the merged row on iOS.
#
# --- App settings: recording rows, then the theme switcher ---
- assertVisible: 'App settings.*'
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Keep screen awake.*'
          commands:
            - tapOn: 'App settings.*'
      - extendedWaitUntil:
          visible: 'Keep screen awake.*'
          timeout: 5000
- assertVisible: 'Keep screen awake.*'
- assertVisible: 'GPS point spacing.*'
# Display: theme switcher — force Dark, prove the screen survives the theme
# swap, then back to System so reruns and later flows see the default look.
- scrollUntilVisible:
    element:
      text: 'Theme.*'
    direction: DOWN
- tapOn: 'Dark'
- assertVisible: 'Theme.*'
- tapOn: 'System'
- assertVisible: 'Theme.*'
# --- Data settings: the relocated "Locally downloaded only" switch (moved
# here from the map's Overlays menu, D-7) + export row present (do not tap
# either — the switch flips real network gating; the export opens the share
# sheet) ---
- scrollUntilVisible:
    element:
      text: 'Data settings.*'
    direction: DOWN
    centerElement: true
# No open-guard here: the AccordionGroup keeps exactly one category open, and
# the flow just left 'App settings' open — so Data settings is closed and a
# single tap opens it. A guard is actively harmful now that the body is long
# (marine packs + the relocated switch): once the body scrolls, its sentinel
# leaves the viewport and the retry re-taps the header, closing the category.
- tapOn: 'Data settings.*'
# Opening this (now long) category leaves the viewport below its first rows,
# so the relocated switch sits ABOVE the fold — scroll UP to reach it.
- scrollUntilVisible:
    element:
      text: 'Locally downloaded only.*'
    direction: UP
# The relocated switch row sits at the very top of the category body.
- assertVisible: 'Locally downloaded only.*'
- scrollUntilVisible:
    element:
      text: 'Download your data.*'
    direction: DOWN
# --- Third party: the Strava row exists; unconfigured builds show a
# disabled "Connect Strava" with the not-configured subtitle ---
- scrollUntilVisible:
    element:
      text: 'Third party.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Connections.*'
          commands:
            - tapOn: 'Third party.*'
      - extendedWaitUntil:
          visible: 'Connections.*'
          timeout: 5000
- scrollUntilVisible:
    element:
      text: '(Connect )?Strava.*'
    direction: DOWN
- assertVisible: '.*(Strava is not configured in this build|Ask to push saved trails to Strava|Connected).*'
# --- System settings: error reporting toggle + queue row (subtitle is
# dynamic — count or "No pending reports", suffixed with channel/last-attempt
# info). Scroll until the QUEUE row itself is visible: scrolling to a title
# stops the moment it peeks above the tab bar, leaving the row off-screen —
# the 2026-08-03 nightly failed exactly there on both the run and its retry.
- scrollUntilVisible:
    element:
      text: 'System settings.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Privacy.*'
          commands:
            - tapOn: 'System settings.*'
      - extendedWaitUntil:
          visible: 'Privacy.*'
          timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Automatic error reporting.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Error report queue.*'
    direction: DOWN
- assertVisible: 'Error report queue.*'
- scrollUntilVisible:
    element:
      text: 'Reset settings'
    direction: DOWN
# --- System info: version + data credits ---
- scrollUntilVisible:
    element:
      text: 'System info.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Offline trail navigation.*'
          commands:
            - tapOn: 'System info.*'
      - extendedWaitUntil:
          visible: 'Offline trail navigation.*'
          timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Version.*'
    direction: DOWN
# Scroll to the credits row itself — stopping at Version leaves the next row
# under the tab bar on iOS (same lesson as the Error report queue row above).
- scrollUntilVisible:
    element:
      text: 'Maps & data.*'
    direction: DOWN
- assertVisible: 'Maps & data.*'
