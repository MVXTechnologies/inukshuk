# Team drawing e2e (#683), one phone, on the loopback mesh build (see team.yaml).
#
# Create a team → the Draw chip under the team pill → drawing mode (tool bar,
# top bar) → Time: fade Never → Arrow → one-finger drag draws it →
# Done → tap the arrow: its card → leave the team.
#
# Then the owner's review screenshots (#756/#757), light and dark
# (subflows/team-review.yaml): the team pill and its chips with the SOS
# button, the panel, the task list, the long-press grid, drawing mode with
# its Shape and Time panels; the Display size at Small and Large (#760,
# subflows/display-size-review.yaml: settings, library, map, team), reset to
# Default; after leaving, the normal-mode long-press card.
# The theme goes back to System at the end.
#
# First of the team shard, on the shard's fresh emulator; it does not clear
# state itself (team.yaml, which does, must stay last), so it creates its own
# team and leaves it at the end. Settings rows merge title + subtitle on iOS:
# wildcard regexes (maestro-ios-tap-traps).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
            notifications: allow
- tapOn:
    text: 'Got it'
    optional: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- setLocation:
    latitude: 47.0745
    longitude: -70.9065
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: '.*Team mode.*'
          commands:
            - tapOn: 'Extensions.*'
      - scrollUntilVisible:
          element: '.*Team mode.*'
          direction: DOWN
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'extension-row-team'
    direction: DOWN
- runFlow:
    when:
      visible: 'Get Team mode'
    commands:
      - tapOn: 'Get Team mode'
- runFlow:
    when:
      notVisible:
        id: 'extension-details-team'
    commands:
      - tapOn:
          id: 'extension-row-team'
- scrollUntilVisible:
    element:
      id: 'team-create-row'
    direction: DOWN
- tapOn:
    id: 'team-create-row'
- extendedWaitUntil:
    visible:
      id: 'team-create-screen'
    timeout: 10000
- tapOn:
    id: 'team-create-name'
- inputText: 'Ridge crew'
- tapOn:
    id: 'team-create-myname'
- eraseText: 40
- inputText: 'Marc'
- hideKeyboard
- tapOn:
    id: 'team-create-ends-14d'
- tapOn:
    id: 'team-create-submit'
- extendedWaitUntil:
    visible: '(Allow|Ridge crew)'
    timeout: 40000
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 15000
# Manage team › Drawings (the organizer is an admin): none yet.
- scrollUntilVisible:
    element:
      id: 'team-drawings-row'
    direction: DOWN
- assertVisible: '.*None on the map.*'
# To the map.
- tapOn: 'Back'
- tapOn: 'Back'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'team-bar-pill'
    timeout: 10000
# Draw: the chip under the team pill, after Chat and Meet here (#757).
- tapOn:
    id: 'team-chip-draw'
- extendedWaitUntil:
    visible:
      id: 'team-draw-toolbar'
    timeout: 5000
# Drawing mode owns the screen: no team bar, no SOS button, no search. (Its hint shows on
# this install's first three entries only, counted across launches, so a flow
# retried on the same install may be past them: not asserted here; the
# component and store tests cover it.)
- assertNotVisible:
    id: 'team-bar-pill'
- assertNotVisible:
    id: 'team-sos-button'
- assertNotVisible: 'Search places'
- takeScreenshot: team-draw-entered
# Time (#756): fades Never (the arrow must outlive this flow's taps).
- tapOn:
    id: 'team-draw-time'
- extendedWaitUntil:
    visible:
      id: 'team-draw-panel-time'
    timeout: 5000
- takeScreenshot: team-draw-time
- tapOn:
    id: 'team-draw-fade-6'
- tapOn:
    id: 'team-draw-panel-close'
# Arrow: one finger from tail to head.
- tapOn:
    id: 'team-draw-tool-arrow'
- swipe:
    start: '50%,62%'
    end: '50%,42%'
    duration: 900
# Sent: Undo is live now, and the arrow tool stays selected.
- extendedWaitUntil:
    visible:
      id: 'team-draw-undo'
      enabled: true
    timeout: 5000
- takeScreenshot: team-draw-arrow
- tapOn:
    id: 'team-draw-done'
- extendedWaitUntil:
    visible:
      id: 'team-bar-pill'
    timeout: 5000
# Outside drawing mode, a tap on the arrow's shaft opens its card.
- tapOn:
    point: '50%,52%'
- extendedWaitUntil:
    visible:
      id: 'team-shape-card'
    timeout: 5000
- assertVisible: '.*You · arrow.*'
- assertVisible: '.*Never fades.*'
- takeScreenshot: team-draw-card
- tapOn:
    id: 'team-shape-delete'
- extendedWaitUntil:
    notVisible:
      id: 'team-shape-card'
    timeout: 5000
# --- Review screenshots (#756/#757). A task of mine first, for the list's
# Edit and Delete.
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-tasks'
- extendedWaitUntil:
    visible:
      id: 'team-tasks-screen'
    timeout: 5000
- tapOn:
    id: 'team-task-new'
- tapOn:
    id: 'team-task-title'
- inputText: 'Check the bridge at km 4'
- hideKeyboard
- tapOn: 'Me'
- tapOn:
    id: 'team-task-place-none'
- tapOn:
    id: 'team-task-create'
- extendedWaitUntil:
    visible: '.*Check the bridge at km 4.*'
    timeout: 5000
- tapOn: 'Back'
- runFlow:
    file: subflows/team-review.yaml
    env:
      THEME: light
# Display size (#760): Small then Large, light, in team mode.
- runFlow:
    file: subflows/display-size-review.yaml
    env:
      SIZE: small
      SIZE_ID: '0.85'
      THEME: light
- runFlow:
    file: subflows/display-size-review.yaml
    env:
      SIZE: large
      SIZE_ID: '1.15'
      THEME: light
- runFlow:
    file: subflows/set-theme.yaml
    env:
      NEXT: Dark
- runFlow:
    file: subflows/set-display-size.yaml
    env:
      SIZE_ID: '1'
- runFlow:
    file: subflows/team-review.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/display-size-review.yaml
    env:
      SIZE: small
      SIZE_ID: '0.85'
      THEME: dark
- runFlow:
    file: subflows/display-size-review.yaml
    env:
      SIZE: large
      SIZE_ID: '1.15'
      THEME: dark
# Back to Default for everything after.
- runFlow:
    file: subflows/set-display-size.yaml
    env:
      SIZE_ID: '1'
# Leave the team (it is deleted from this phone): the panel's Manage team.
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-manage'
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 5000
- scrollUntilVisible:
    element: 'Leave team'
    direction: DOWN
- tapOn: 'Leave team'
- tapOn: 'Leave'
- extendedWaitUntil:
    notVisible:
      id: 'team-hub-screen'
    timeout: 10000
# Normal mode now: the long-press point card (#757 c), dark then light; the
# theme goes back to System.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
- longPressOn:
    point: '50%,50%'
- extendedWaitUntil:
    visible:
      id: 'point-card'
    timeout: 5000
- assertVisible:
    id: 'point-card-grid'
- takeScreenshot: review-point-card-dark
- tapOn:
    id: 'point-card-close'
- extendedWaitUntil:
    notVisible:
      id: 'point-card'
    timeout: 5000
- runFlow:
    file: subflows/set-theme.yaml
    env:
      NEXT: System
- longPressOn:
    point: '50%,50%'
- extendedWaitUntil:
    visible:
      id: 'point-card'
    timeout: 5000
- assertVisible:
    id: 'point-card-grid'
- takeScreenshot: review-point-card-light
- tapOn:
    id: 'point-card-close'
- extendedWaitUntil:
    notVisible:
      id: 'point-card'
    timeout: 5000
