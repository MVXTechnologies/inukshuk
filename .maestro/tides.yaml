# Tide stations overlay e2e: the overlays menu carries the "Tide stations"
# switch (NOAA, SHOM, Kartverket, JMA — never CHS) with its legend; switching
# it on keeps the menu usable and the legend live; the flow leaves it off.
# The station card itself (levels in three datums, copy buttons) is covered
# by src/core/tides/card.test.ts and the sim screenshots
# (chart-datum-convert/build/), since a station's screen position depends
# on the camera.
#
# The row's accessibility text is exactly "Tide stations" (a switch); the
# legend is "Gauge symbols legend" so the two never collide.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn: 'Map overlays'
# The sheet's rows scroll under its header, and Maestro calls a row there
# "visible" (a tap then lands on the scrim and closes the menu). So: scroll
# the row into the list, then nudge the list back down a little.
- scrollUntilVisible:
    element: 'Tide stations'
    direction: DOWN
- swipe:
    start: 50%, 60%
    end: 50%, 72%
    duration: 600
- waitForAnimationToEnd
- assertVisible: 'Live gauge'
# Flip the switch, close and reopen the menu (the map restyles with or
# without the tide layer), then flip it back: the flow leaves the setting as
# it found it (off by default).
- tapOn: 'Tide stations'
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
- tapOn: 'Map overlays'
# The sheet's rows scroll under its header, and Maestro calls a row there
# "visible" (a tap then lands on the scrim and closes the menu). So: scroll
# the row into the list, then nudge the list back down a little.
- scrollUntilVisible:
    element: 'Tide stations'
    direction: DOWN
- swipe:
    start: 50%, 60%
    end: 50%, 72%
    duration: 600
- waitForAnimationToEnd
- assertVisible: 'Live gauge'
- tapOn: 'Tide stations'
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
