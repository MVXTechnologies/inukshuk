# Tide stations extension e2e: Settings → Extensions → "Get Tide stations"
# installs it from its collapsed one-line row, whose switch then works
# without expanding; tapping the row expands its details (coverage, Remove);
# the overlays sheet's Extensions tab then carries its one-line switch row;
# the flow flips it off and on, then removes the extension again so other
# flows see the default state. On the way it turns "Show levels on the map"
# (#764) on and off in the sub-panel, with review shots light and dark, and
# with it on, the levels on the map and Boston's card, graph first, in both
# themes (NOAA's live gauge: the CI emulator has the network). The card's
# details (levels in three datums, copy buttons) are covered by
# src/core/tides/card.test.ts and TideStationCard.test.tsx.
#
# Settings rows merge title + subtitle on iOS, so their matches are wildcard
# regexes; the overlays rows' accessibility text is exactly their label.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
# The Library header's Settings button: wait for it, the tab switch may
# still be settling (CI 2026-10-06: an immediate tap found nothing).
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      # The section's first row: Geodetic points, installed or not (the tide
      # rows may be below the fold).
      - runFlow:
          when:
            notVisible: 'Geodetic points.*'
          commands:
            - tapOn: 'Extensions.*'
      - extendedWaitUntil:
          visible: 'Geodetic points.*'
          timeout: 5000
# Start from "not installed" whatever a previous run left (its rows may be
# below the fold: scroll to whichever of Get / Remove is there).
# Collapsed rows: Get when not installed, the switch once installed.
- scrollUntilVisible:
    element: '(Get Tide stations|Show tide stations)'
    direction: DOWN
# Start from "not installed" whatever a previous run left.
- runFlow:
    when:
      visible: 'Show tide stations'
    commands:
      - tapOn:
          id: 'extension-row-tides'
      - scrollUntilVisible:
          element: 'Remove Tide stations extension'
          direction: DOWN
      - tapOn: 'Remove Tide stations extension'
      - tapOn: 'Remove'
      # Removing keeps the row open: close it, the checks below start
      # from a collapsed row.
      - scrollUntilVisible:
          element:
            id: 'extension-row-tides'
          direction: UP
      - tapOn:
          id: 'extension-row-tides'
      - extendedWaitUntil:
          notVisible:
            id: 'extension-details-tides'
          timeout: 5000
- scrollUntilVisible:
    element: 'Get Tide stations'
    direction: DOWN
- tapOn: 'Get Tide stations'
# Get works from the collapsed row: its switch takes Get's place, and the
# switch works without expanding (off, then on again).
- extendedWaitUntil:
    visible: 'Show tide stations'
    timeout: 10000
# Collapsed: read from the details container, not a row inside it (those
# can sit below the fold either way).
- assertNotVisible:
    id: 'extension-details-tides'
- tapOn: 'Show tide stations'
- tapOn: 'Show tide stations'
# Tapping the row expands its details; Coverage & sources and Remove land
# below the fold on a Pixel 6 (Extensions is the last Settings section;
# main 2026-10-08, run 37709319900): scroll to them, don't assert in place.
- tapOn:
    id: 'extension-row-tides'
- extendedWaitUntil:
    visible:
      id: 'extension-details-tides'
    timeout: 10000
- scrollUntilVisible:
    element: 'Tide coverage & sources.*'
    direction: DOWN
- scrollUntilVisible:
    element: 'Remove Tide stations extension'
    direction: DOWN
- tapOn: 'Back'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- tapOn: 'Map overlays'
- tapOn: 'Extensions tab'
- assertVisible: 'Tide stations'
# One line per extension: the gauge legend is in Settings, not here.
- assertNotVisible: 'Live gauge'
- assertVisible: 'Get more extensions'
# Off, then on again.
- tapOn: 'Tide stations'
- tapOn: 'Tide stations'
# "Show levels on the map" (#764): its row sits under the stations' switch in
# the sub-panel; on, the level labels' three looks join the symbols legend.
# Review shots in both themes (the owner's phone runs dark), each asserted
# first; the setting is left off.
- tapOn: 'Options for Tide stations'
- extendedWaitUntil:
    visible: 'Show levels on the map.*'
    timeout: 5000
- assertNotVisible: 'Predicted'
- tapOn: 'Show levels on the map.*'
- extendedWaitUntil:
    visible: 'Predicted'
    timeout: 5000
- assertVisible: 'Water level by each station.*'
- takeScreenshot: review-tides-levels-panel-light
- tapOn: 'Back to extensions'
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
- setLocation:
    latitude: 42.35209
    longitude: -71.05028
# The levels on the map (#764) and a station's card, graph first (light):
# the map follows the fix, 200 m south of NOAA's Boston gauge (8443970), so
# the puck doesn't hide the station: at the follow camera's z14 it sits 28 dp
# above the map's centre (the map area ends at the info strip: centre 47 %,
# the station 44 %). A tap there opens its card; the guarded tap retries while the
# station's tile is still loading. The graph proves the series loaded, the
# same series the map's labels draw from; with the card closed, the map
# shot shows them.
- runFlow:
    when:
      notVisible:
        id: 'tide-card'
    commands:
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: 'tide-card'
                commands:
                  - tapOn:
                      point: '50%,44%'
            - extendedWaitUntil:
                visible:
                  id: 'tide-card'
                timeout: 10000
- assertVisible: 'Boston.*'
- extendedWaitUntil:
    visible:
      id: 'tide-graph'
    timeout: 30000
- takeScreenshot: review-tides-card-light
- tapOn: 'Close tide station'
- extendedWaitUntil:
    notVisible:
      id: 'tide-card'
    timeout: 5000
- takeScreenshot: review-tides-map-light
- runFlow:
    file: subflows/set-theme.yaml
    env:
      NEXT: Dark
# The levels on the map (#764) and a station's card, graph first (dark):
# the map follows the fix, 200 m south of NOAA's Boston gauge (8443970), so
# the puck doesn't hide the station: at the follow camera's z14 it sits 28 dp
# above the map's centre (the map area ends at the info strip: centre 47 %,
# the station 44 %). A tap there opens its card; the guarded tap retries while the
# station's tile is still loading. The graph proves the series loaded, the
# same series the map's labels draw from; with the card closed, the map
# shot shows them.
- runFlow:
    when:
      notVisible:
        id: 'tide-card'
    commands:
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: 'tide-card'
                commands:
                  - tapOn:
                      point: '50%,44%'
            - extendedWaitUntil:
                visible:
                  id: 'tide-card'
                timeout: 10000
- assertVisible: 'Boston.*'
- extendedWaitUntil:
    visible:
      id: 'tide-graph'
    timeout: 30000
- takeScreenshot: review-tides-card-dark
- tapOn: 'Close tide station'
- extendedWaitUntil:
    notVisible:
      id: 'tide-card'
    timeout: 5000
- takeScreenshot: review-tides-map-dark
- tapOn: 'Map overlays'
- tapOn: 'Extensions tab'
- tapOn: 'Options for Tide stations'
- extendedWaitUntil:
    visible: 'Predicted'
    timeout: 5000
- assertVisible: 'Show levels on the map.*'
- takeScreenshot: review-tides-levels-panel-dark
- tapOn: 'Show levels on the map.*'
- extendedWaitUntil:
    notVisible: 'Predicted'
    timeout: 5000
- tapOn: 'Back to extensions'
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
- runFlow:
    file: subflows/set-theme.yaml
    env:
      NEXT: System
# Back to the shard's usual fix (Québec), as the emulator starts.
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
# Leave it uninstalled.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
# The Library header's Settings button: wait for it, the tab switch may
# still be settling (CI 2026-10-06: an immediate tap found nothing).
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      # The section's first row: Geodetic points, installed or not (the tide
      # rows may be below the fold).
      - runFlow:
          when:
            notVisible: 'Geodetic points.*'
          commands:
            - tapOn: 'Extensions.*'
      - extendedWaitUntil:
          visible: 'Geodetic points.*'
          timeout: 5000
# Every visit starts collapsed: expand it to reach Remove.
- scrollUntilVisible:
    element:
      id: 'extension-row-tides'
    direction: DOWN
- tapOn:
    id: 'extension-row-tides'
- scrollUntilVisible:
    element: 'Remove Tide stations extension'
    direction: DOWN
- tapOn: 'Remove Tide stations extension'
- tapOn: 'Remove'
- extendedWaitUntil:
    visible: 'Get Tide stations'
    timeout: 5000
