# Trail view e2e (#134/#137/#140, #480): open a saved trail from the Library,
# check the focused view's map and exercise the control rail's basemap and
# overlay menus, then leave. Crash-detection: the view must mount and stay
# responsive on a software-GL emulator.
#
# Portability notes:
# - Runs after category-record.yaml (needs >= 1 saved trail). Cards' a11y
#   label is "<name> — open trail view, long-press to select" (em dash).
# - #480 removed the rail's 2D/3D toggle (owner call): the focused view is the
#   MapLibre map, tilted with two fingers like the main map. The three.js
#   terrain view is no longer reachable, so this flow no longer builds it.
# - #140's right-edge rail: a "Trail layers" FAB (basemap menu: Relief/Map/
#   Satellite) and a "Trail overlays" FAB (Slope / Contours / Elevation tint
#   switches + contour-interval picker). Both a11y labels are identical on
#   both platforms. The overlays FAB renders ONLY when overlaysAvailable, so
#   it's exercised conditionally.
# - The rail menus are Paper Menus: a tap anywhere outside lands on the
#   dismiss backdrop and only closes the menu (it does NOT reach what's
#   underneath), so a far-left point tap is a safe dual-platform dismissal.
# - The back control is Paper's Appbar.BackAction (default a11y label "Back").
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
# Wait for the map screen to fully mount before touching the tab bar — a tab
# tap fired mid-cold-start can be dropped while the hierarchy is churning.
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- assertVisible: 'Recorded trails.*'
- tapOn: '.* — open trail view, long-press to select'
# Trail screen chrome: the layers FAB proves it mounted.
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 30000
- assertVisible: 'Notes.*'
# The 2D/3D toggle is gone (#480) — its labels must not come back.
- assertNotVisible: 'Switch to (2D|3D) view'
# The layers menu carries the basemap trio. Assert the choices, then dismiss
# without picking one. ("Map" is not asserted: it would also match the tab
# bar's Map tab.)
- tapOn: 'Trail layers'
- extendedWaitUntil:
    visible: 'Relief'
    timeout: 60000
- assertVisible: 'Satellite'
- tapOn:
    point: 50%,8%
# Overlay switches live in the overlays FAB's menu (#134 fallback keeps the
# FAB off screen when the shaders can't compile): exercise them when present,
# skip silently otherwise. The menu stays open across toggles.
- runFlow:
    when:
      visible: 'Trail overlays'
    commands:
      - tapOn: 'Trail overlays'
      - extendedWaitUntil:
          visible: 'Elevation tint'
          timeout: 60000
      - tapOn: 'Slope'
      # First-ever Slope enable fires the one-time disclaimer snackbar; its
      # Portal mount can transiently hide the menu from the a11y tree on a
      # loaded emulator — re-await the row instead of tapping blind.
      - extendedWaitUntil:
          visible: 'Contours'
          timeout: 15000
      - tapOn: 'Contours'
      # (The contour-interval rows that appear with Contours are not
      # exercised: on software-GL Android a single hierarchy fetch can take
      # minutes, so waiting on the sub-items here is pure flake.)
      - tapOn: 'Elevation tint'
      # All three on and the app is still responsive; turn them back off so
      # reruns start clean, then close the menu via the backdrop.
      - tapOn: 'Elevation tint'
      - tapOn: 'Contours'
      - tapOn: 'Slope'
      - tapOn:
          point: 50%,8%
# Still responsive: leave.
- assertVisible: 'Notes.*'
- tapOn: 'Back'
- assertVisible: 'Recorded trails.*'
