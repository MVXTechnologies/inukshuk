# Trail detail e2e: 2D map, basemap picker, profile and notes while 3D is parked (#284).
# Runs after category-record.yaml to provide a saved trail.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
# Wait for the map screen to fully mount before touching the tab bar — a tab
# tap fired mid-cold-start can be dropped while the hierarchy is churning.
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- assertVisible: 'Recorded trails.*'
- tapOn: '.* — open trail view, long-press to select'
# Parked 3D (#284): old saved preferences must still open a responsive 2D view.
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 15000
- assertNotVisible: 'Switch to (2D|3D) view'
- assertNotVisible: 'Trail overlays'
- assertNotVisible: 'Building 3D terrain.*'
- assertVisible: 'Notes.*'
# The basemap picker stays available in 2D.
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 30000
- tapOn: 'Trail layers'
- extendedWaitUntil:
    visible: 'Relief'
    timeout: 60000
- assertVisible: 'Satellite'
- tapOn:
    point: 50%,8%
- assertVisible: 'Notes.*'
- tapOn: 'Back'
- assertVisible: 'Recorded trails.*'
