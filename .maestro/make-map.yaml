# Map maker e2e (1.4.0): "+" dial → Make a map → region box (default) → options
# sheet → Create → real compose (tile fetch + terrain + PDF) → Library entry.
#
# Portability notes:
# - Needs network (Esri basemap tiles + Terrarium DEM) — same services the
#   3D-terrain flows already exercise in CI.
# - Contours stay ON (default) so the compose covers the heightmap path;
#   slope follows the persisted setting (off on a fresh install — fine).
# - The compose is CPU-bound on software-GL emulators: generous timeout on the
#   success snackbar, then the Library must list the map by its default name
#   prefix ("My map <date>" — asserted via regex).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn: 'Map actions'
- tapOn: 'Make a map'
# Step 1: the bare region selector (no layers/quality — just the box + Next).
- extendedWaitUntil:
    visible: 'Make a map — choose the area'
    timeout: 10000
- assertNotVisible: 'Standard'
# Next enables once the flatten settles and the box geometry lands.
- extendedWaitUntil:
    visible: 'Next'
    timeout: 10000
- tapOn: 'Next'
# Step 2: the desk & drawer editor — live preview up top, tabbed drawer
# below. Walk all three tabs (Layers is the default), then Create with the
# defaults (Map basemap, A4, contours + grid + compass on).
- extendedWaitUntil:
    visible: 'Contour lines'
    timeout: 15000
- tapOn: 'Page'
- extendedWaitUntil:
    visible: 'Map name'
    timeout: 8000
- tapOn: 'Extras'
- extendedWaitUntil:
    visible: 'Gridlines'
    timeout: 8000
- tapOn: 'Layers'
- extendedWaitUntil:
    visible: 'Contour lines'
    timeout: 8000
- tapOn: 'Create'
# Compose runs for real — tiles, DEM, PDF. Success lands as a snackbar.
- extendedWaitUntil:
    visible: '.*saved to the library.*'
    timeout: 180000
# The made map must now exist in the Library, named with the default prefix.
# (iOS labels tab items "Library, tab, N of M" — same regex as every flow.)
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'My map .*'
    timeout: 15000
# Back to the map tab so later flows start from the usual place.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
