# Map maker e2e (#349): "+" dial -> Make a map -> the full-screen EDITOR over
# the live map -> Create -> real compose (tile fetch + terrain + PDF) -> Library.
#
# There is no region-box step any more: the sheet framed on the live map IS the
# selection, so the flow goes straight from the menu into the editor.
#
# Portability notes:
# - Needs network (Esri basemap tiles + Terrarium DEM) - same services the
#   3D-terrain flows already exercise in CI.
# - Contours stay ON (default) so the compose covers the heightmap path.
# - The compose is CPU-bound on software-GL emulators: generous timeout on the
#   success snackbar, then the Library must list the map by its default name
#   prefix ("My map <date>" - asserted via regex).
# - Controls are addressed by testID, not by copy: renaming a chip must not
#   break this flow (it did, every time, before #349).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Make a map'
          commands:
            - tapOn: 'Map actions'
      - extendedWaitUntil:
          visible: 'Make a map'
          timeout: 60000
- tapOn: 'Make a map'
# The editor opens straight onto the live map - no box, no "Next".
- extendedWaitUntil:
    visible:
      id: 'make-map-editor'
    timeout: 15000
- assertNotVisible: 'Make a map — choose the area'
# The readout proves the frame is bound to the camera: it can only render a
# scale and a coverage once a real view state has been read back.
- extendedWaitUntil:
    visible:
      id: 'make-map-readout'
    timeout: 15000
- assertVisible: '1:.*'
# Page & scale is the default tab: a scale rung and a page shape.
- tapOn:
    id: 'make-map-chip-s50000'
- tapOn:
    id: 'make-map-chip-la'
# Layers & style: swap the print source, then the overlay toggles.
- tapOn:
    id: 'make-map-tab-layers'
- tapOn:
    id: 'make-map-chip-imagery'
- tapOn:
    id: 'make-map-chip-street'
- tapOn:
    id: 'make-map-toggle-slope'
- tapOn:
    id: 'make-map-toggle-grid'
- tapOn:
    id: 'make-map-toggle-grid'
# What to draw: the content picker replaces the old blanket switch.
- tapOn:
    id: 'make-map-tab-draw'
- tapOn:
    id: 'make-map-chip-picknone'
- tapOn:
    id: 'make-map-chip-pickall'
- tapOn:
    id: 'make-map-tab-page'
# Collapse to full bleed and come back, so the readout's restore path is covered.
- tapOn:
    id: 'make-map-collapse'
- assertNotVisible: 'Map name'
- tapOn:
    id: 'make-map-readout'
- extendedWaitUntil:
    visible: 'Map name'
    timeout: 8000
- tapOn:
    id: 'make-map-create'
# Compose runs for real - tiles, DEM, PDF. Success lands as a snackbar.
- extendedWaitUntil:
    visible: '.*saved to the library.*'
    timeout: 180000
# The made map must now exist in the Library, named with the default prefix.
# (iOS labels tab items "Library, tab, N of M" - same regex as every flow.)
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'My map .*'
    timeout: 15000
# Back to the map tab so later flows start from the usual place.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
