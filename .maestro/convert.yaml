# Convert e2e: the map-actions row opens Convert; a deep link opens it on
# survey mark 81KM003's published values (NAD83(CSRS) 1997.0, h -3.127);
# without the Québec grid pack the CGVD2013 height is REFUSED with the pack
# offered (never approximated); dropping the height gives the MTM 7 result
# with an exact (projection-only) accuracy panel.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn: 'Map actions'
- tapOn: 'Convert coordinates'
- extendedWaitUntil:
    visible:
      id: 'convert-screen'
    timeout: 10000
- tapOn: 'Back'
- openLink: 'inukshuk://convert?from=csrs%3Ageo&epoch=1997.0&a=46.851168&b=-71.238585&h=-3.127&fh=ell&to=csrs%3Amtm7&th=cgvd2013a&label=From%20mark%2081KM003&kind=mark&lon=-71.238585&lat=46.851168'
- extendedWaitUntil:
    visible: 'From mark 81KM003'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'convert-status-red'
    timeout: 10000
- assertVisible: '.*Needs CGG2013a.*'
- tapOn:
    id: 'convert-to-height'
- tapOn:
    id: 'convert-pick-none'
- extendedWaitUntil:
    visible:
      id: 'convert-result-e'
    timeout: 10000
- assertVisible:
    id: 'convert-status-green'
# Geodetic card → Convert on a Québec levelling benchmark (field report,
# Android 2.3.0: "every point says there is no usable data Convert can
# read"). This is the exact link the card sends for MRNF 84KM654 from the
# live tiles — markToConvert.test.ts keeps the two in sync. The open-data
# layer's Québec Lambert must be READ (no "no published coordinates"
# notice), the CGVD28 height asks for the grid pack, and the position-only
# result is amber with the approximate-position line.
- tapOn: 'Back'
- openLink: 'inukshuk://convert?from=csrs%3Aqclambert&to=csrs%3Amtm7&a=-208379.906&b=317906.512&lon=-71.23569444&lat=46.82080556&fh=cgvd28&th=ell&h=6.49&epoch=1997.0&label=From%20mark%2084KM654&kind=mark&pub=%5B%7B%22heightId%22%3A%22cgvd28%22%2C%22text%22%3A%226.49%22%7D%5D&pacc=2&pwhy=84KM654%20is%20a%20levelling%20benchmark%3A%20its%20height%20is%20precise%2C%20its%20position%20only%20approximate'
- extendedWaitUntil:
    visible: 'From mark 84KM654'
    timeout: 15000
- assertNotVisible: '.*no published coordinates.*'
- extendedWaitUntil:
    visible:
      id: 'convert-status-red'
    timeout: 10000
- assertVisible: '.*Needs HTv2.0.*'
- tapOn:
    id: 'convert-to-height'
- tapOn:
    id: 'convert-pick-none'
- extendedWaitUntil:
    visible:
      id: 'convert-result-e'
    timeout: 10000
- assertVisible:
    id: 'convert-status-amber'
- scrollUntilVisible:
    element: 'Approximate position:.*'
    direction: DOWN
- assertNotVisible:
    id: 'convert-status-red'
