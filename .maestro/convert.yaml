# Convert e2e: the map-actions row opens Convert; a deep link opens it on
# survey mark 81KM003's published values (NAD83(CSRS) 1997.0, h -3.127);
# without the Québec grid pack the CGVD2013 height is REFUSED with the pack
# offered (never approximated); dropping the height gives the MTM 7 result
# with an exact (projection-only) accuracy panel.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# Guarded opener (make-map.yaml's idiom): the dial animates open, so wait for
# its row instead of tapping it at once (CI 2026-10-06: the immediate tap on
# 'Convert coordinates' found nothing), and only re-tap 'Map actions' while
# the row is absent, so a retry never toggles an open dial shut.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Convert coordinates'
          commands:
            - tapOn: 'Map actions'
      - extendedWaitUntil:
          visible: 'Convert coordinates'
          timeout: 15000
- tapOn: 'Convert coordinates'
- extendedWaitUntil:
    visible:
      id: 'convert-screen'
    timeout: 10000
- tapOn: 'Back'
- openLink: 'inukshuk://convert?from=csrs%3Ageo&epoch=1997.0&a=46.851168&b=-71.238585&h=-3.127&fh=ell&to=csrs%3Amtm7&th=cgvd2013a&label=From%20mark%2081KM003&kind=mark&lon=-71.238585&lat=46.851168'
- extendedWaitUntil:
    visible: 'From mark 81KM003'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'convert-status-red'
    timeout: 10000
- assertVisible: '.*Needs CGG2013a.*'
- tapOn:
    id: 'convert-to-height'
- tapOn:
    id: 'convert-pick-none'
- extendedWaitUntil:
    visible:
      id: 'convert-result-e'
    timeout: 10000
# The accuracy panel: the projection-only conversion is exact, and it is not
# refused. Not asserted green: the deep link's 6-decimal latitude is worth
# ±0.11 m (format.ts parseAngle), above INPUT_AMBER_M (0.02 m), so the panel
# is AMBER with an "Input limits the result" line (accuracy.ts buildPanel) —
# the green assert never passed on Android CI (2026-10-06). Whether a
# deep-linked mark's precision should count as "typed" is an app question;
# this asserts what holds either way.
- assertVisible: 'exact \(stated, combined\)'
- assertNotVisible:
    id: 'convert-status-red'
