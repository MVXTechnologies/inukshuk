# Map store e2e: Search tab → sharded fixture catalog → "Around you" → category
# → text search → download with the destination dialog → the map lands in the
# Library.
#
# Fixture wiring — CI must NEVER hit NRCan/NOAA/USGS:
# - The APK is built with CATALOG_MANIFEST_URL=http://127.0.0.1:8787/index.json
#   (extra.catalogManifestUrl override; cleartext to loopback is already
#   allowed by withLocalhostCleartext).
# - The device's 127.0.0.1:8787 is mapped to the host with
#   `adb reverse tcp:8787 tcp:8787`, where a static server serves
#   .maestro/fixtures/catalog/ (index.json + shards/*.json + four ~1 KB zipped
#   GeoPDFs generated by scripts/catalog/make-fixture.ts). See e2e-attempts.sh.
#
# The fixture is SHARDED (index + search.json + shards/topo-n40w080.json +
# shards/nautical-n40w080.json), which is the point: this flow is the only
# place the production path — fetch index, rank shards nearest-first, fetch the
# ones that matter, consult the search digest when the user types — runs on a
# device. Its FIVE items are three CanTopo sheets ("Québec — CanTopo 021L14",
# "Saint-Raymond — CanTopo 021L13", "Lac-Saint-Joseph — CanTopo 021L11") and
# two nautical charts, all around Québec City, so:
# - the landing shows Topo AND Nautical category cards;
# - "Around you" has a cross-category mix to show (the emulator is geo-fixed to
#   Québec by e2e-attempts.sh, and this flow re-sets the same point so the
#   section does not depend on a GPS race);
# - the section holds exactly NEARBY_ROWS = 5 rows, which is only true when the
#   per-category cap adapts to the categories present (3 topo + 2 nautical).
#   That count is deliberate: it is what the shipped bug got wrong. A fixed cap
#   of 2 renders 4 rows and drops 021L11, so the assertion below on the THIRD
#   topo sheet is what stands between that regression and users — in the
#   production catalog, which is a single category, the same bug capped the
#   whole section at 2 rows;
# - "raymond" (diacritic-folded search) keeps 021L13 and drops the other two.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# Pin the position before leaving the Map tab: the Search landing's "Around
# you" reads settingsStore.lastKnownPosition, which the map persists on its
# FIRST fix (shouldPersistPosition). Same coordinates as e2e-attempts.sh's
# `adb emu geo fix`, so the section never depends on a GPS race.
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
# (iOS labels tab items "Search, tab, N of M" — same regex as every flow.)
- tapOn:
    text: 'Search(, tab.*)?'
    retryTapIfNoChange: true
# "Around you" proves the whole sharded path on a device: index fetched,
# shards ranked nearest-first, the two nearest fetched and merged — then the
# nearest few items across BOTH categories, so a chart and a topo sheet share
# the section (the per-category cap is what stops topo taking all the rows).
- extendedWaitUntil:
    visible: 'Around you.*'
    timeout: 40000
- extendedWaitUntil:
    visible: '.*Chart 14771.*'
    timeout: 20000
# All five rows: both charts and ALL THREE topo sheets. The third topo sheet
# (021L11) is the row a fixed per-category cap of 2 silently drops — asserting
# it here is what makes this flow able to catch the "Around you" regression at
# all. Scrolled into view because five cards plus the header can outrun a short
# emulator screen; the section scrolls, the guard below re-checks we are still
# on the landing.
- assertVisible: '.*Chart 14772.*'
- assertVisible: '.*CanTopo 021L14.*'
- assertVisible: '.*CanTopo 021L13.*'
- scrollUntilVisible:
    element:
      text: '.*CanTopo 021L11.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
# Scroll back to the top of the landing: the guarded category tap below is
# gated on "Around you" still being visible, and five rows are tall enough that
# the scroll above can push the header off screen.
- scrollUntilVisible:
    element:
      text: 'Around you.*'
    direction: UP
    timeout: 20000
    centerElement: true
# The category grid sits BELOW "Around you", so scroll to it rather than
# assuming it is on screen. Matchers are anchored at the start ("Topo.*", not
# ".*Topo.*"): a leading .* would also match the "… — CanTopo 021L14" rows
# above and tap a map card instead of the category.
- scrollUntilVisible:
    element:
      text: 'Topo.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: 'Nautical.*'
# Entering the Topo category shows both fixture sheets (nearest-first list).
# The tap is GUARDED on still being on the landing ("Around you" is only
# rendered there), so a retry can never re-tap once we are already inside.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: 'Around you.*'
          commands:
            - tapOn:
                text: 'Topo.*'
                retryTapIfNoChange: true
      - extendedWaitUntil:
          notVisible: 'Around you.*'
          timeout: 20000
      - extendedWaitUntil:
          visible: '.*CanTopo 021L14.*'
          timeout: 20000
- assertVisible: '.*CanTopo 021L13.*'
# Diacritic-folded text search: "raymond" keeps Saint-Raymond, drops Québec.
- tapOn: 'Search maps'
- inputText: 'raymond'
- extendedWaitUntil:
    notVisible: '.*CanTopo 021L14.*'
    timeout: 10000
- assertVisible: '.*CanTopo 021L13.*'
- assertNotVisible: '.*CanTopo 021L11.*'
# Search-digest proof, on a device: a term the catalog genuinely lacks must
# produce the TRUE empty state. The screen is only allowed to say this once the
# digest has been fetched and reported that no shard anywhere could match —
# without it the query has only seen the shards loaded for this area, and the
# screen says so and offers "Search the whole catalog" instead. This is the
# assertion that would have failed on the shipped build, which answered
# "No maps match your search." for anything outside the loaded area.
- eraseText: 50
- inputText: 'kilimanjaro'
- extendedWaitUntil:
    visible: 'No maps match your search.'
    timeout: 20000
- eraseText: 50
- inputText: 'raymond'
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
- hideKeyboard
# Download → destination dialog (defaults to Ungrouped) → Add.
- tapOn: 'Download'
- extendedWaitUntil:
    visible: 'Add to Library'
    timeout: 10000
- assertVisible: 'Ungrouped'
- tapOn: 'Add'
# The fixture zip is ~1 KB, but the emulator still has to fetch, unzip, parse
# and persist it — the success snackbar names the map.
- extendedWaitUntil:
    visible: '.*added to Library.*'
    timeout: 60000
# Dedup: the card now offers Open instead of Download.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 10000
# The downloaded sheet must be a regular Library map.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
# Back to the map tab so later flows start from the usual place.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
