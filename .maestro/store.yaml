# Map store e2e (M1): Search tab → fixture catalog → text search → download
# with the destination dialog → the map lands in the Library.
#
# Fixture wiring — CI must NEVER hit NRCan:
# - The APK is built with CATALOG_MANIFEST_URL=http://127.0.0.1:8787/manifest.json
#   (extra.catalogManifestUrl override; cleartext to loopback is already
#   allowed by withLocalhostCleartext).
# - The device's 127.0.0.1:8787 is mapped to the host with
#   `adb reverse tcp:8787 tcp:8787`, where a static server serves
#   .maestro/fixtures/catalog/ (manifest.json + two ~1 KB zipped GeoPDFs
#   generated by scripts/catalog/make-fixture.ts). See e2e-attempts.sh.
#
# The fixture manifest has exactly two items ("Québec — CanTopo 021L14",
# "Saint-Raymond — CanTopo 021L13"), both category "topo", so the Wave C
# landing shows a Topo category card and the search step can prove filtering:
# "raymond" (diacritic-folded search) must keep 021L13 and drop 021L14.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# (iOS labels tab items "Search, tab, N of M" — same regex as every flow.)
- tapOn:
    text: 'Search(, tab.*)?'
    retryTapIfNoChange: true
# Wave C: the tab lands on the category grid once the loopback manifest loads.
- extendedWaitUntil:
    visible: 'Topo'
    timeout: 20000
# Entering the Topo category shows both fixture rows (nearest-first list).
- tapOn:
    text: 'Topo'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*CanTopo 021L14.*'
    timeout: 20000
- assertVisible: '.*CanTopo 021L13.*'
# Diacritic-folded text search: "raymond" keeps Saint-Raymond, drops Québec.
- tapOn: 'Search maps'
- inputText: 'raymond'
- extendedWaitUntil:
    notVisible: '.*CanTopo 021L14.*'
    timeout: 10000
- assertVisible: '.*CanTopo 021L13.*'
- hideKeyboard
# Download → destination dialog (defaults to Ungrouped) → Add.
- tapOn: 'Download'
- extendedWaitUntil:
    visible: 'Add to Library'
    timeout: 10000
- assertVisible: 'Ungrouped'
- tapOn: 'Add'
# The fixture zip is ~1 KB, but the emulator still has to fetch, unzip, parse
# and persist it — the success snackbar names the map.
- extendedWaitUntil:
    visible: '.*added to Library.*'
    timeout: 60000
# Dedup: the card now offers Open instead of Download.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 10000
# The downloaded sheet must be a regular Library map.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
# Back to the map tab so later flows start from the usual place.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
