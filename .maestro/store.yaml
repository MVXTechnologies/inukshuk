# Map explorer e2e (#447): Explore tab → sharded fixture catalog → the
# Discover landing ("Popular near you", Collections, By type) → a filtered list
# → a map's detail page → text search → download with the destination dialog
# → the map lands in the Library.
#
# Fixture wiring — CI must NEVER hit NRCan/NOAA/USGS:
# - The APK is built with CATALOG_MANIFEST_URL=http://127.0.0.1:8787/index.json
#   (extra.catalogManifestUrl override; cleartext to loopback is already
#   allowed by withLocalhostCleartext).
# - The device's 127.0.0.1:8787 is mapped to the host with
#   `adb reverse tcp:8787 tcp:8787`, where a static server serves
#   .maestro/fixtures/catalog/ (index.json + shards/*.json + four ~1 KB zipped
#   GeoPDFs generated by scripts/catalog/make-fixture.ts). See e2e-attempts.sh.
#   The fixture has no collections.json, so the Parcs Québec collection is
#   (correctly) hidden and every request for it 404s harmlessly.
#
# The fixture is SHARDED (index + search.json + shards/topo-n40w080.json +
# shards/nautical-n40w080.json + shards/topo-n40w060.json), which is the
# point: this flow is the only place the production path — fetch index, rank
# shards nearest-first, fetch the ones that matter, consult the search digest
# when the user types — runs on a device. Its items are three CanTopo sheets
# around Québec City ("Québec — CanTopo 021L14", "Saint-Raymond — CanTopo
# 021L13", "Lac-Saint-Joseph — CanTopo 021L11"), two NOAA charts, and one
# far-away topo sheet (Newfoundland, for pdf-overlays.yaml), so:
# - "Popular near you" leads with a Canadian sheet (CA-first, the Québec rule
#   — @core/catalog/nearbySections via @core/catalog/popularNear); the
#   emulator is geo-fixed to Québec by e2e-attempts.sh, and this flow re-sets
#   the same point so the carousel does not depend on a GPS race. The carousel
#   is horizontal, so only its first cards are asserted; the per-category cap
#   that once dropped 021L11 is covered by nearby/nearbySections unit tests;
# - "By type" offers Topographic and Nautical, and Topographic lists all
#   three Québec sheets and no chart;
# - "raymond" (diacritic-folded search) keeps 021L13 and drops the other two,
#   and "kilimanjaro" earns the TRUE empty state only once the digest says no
#   shard anywhere could match.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# Pin the position before leaving the Map tab: "Popular near you" reads
# settingsStore.lastKnownPosition, which the map persists on its FIRST fix
# (shouldPersistPosition). Same coordinates as e2e-attempts.sh's
# `adb emu geo fix`, so the carousel never depends on a GPS race.
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
# Explore is the store tab ("Maps" until 2.0.0, "Search" before). iOS labels
# tab items "Explore, tab, N of M" — same regex as every flow.
- tapOn:
    text: 'Explore(, tab.*)?'
    retryTapIfNoChange: true
# "Popular near you" proves the whole sharded path on a device: index fetched,
# shards ranked nearest-first, the nearest fetched and merged, and a Canadian
# sheet leading the carousel.
- extendedWaitUntil:
    visible: 'Popular near you'
    timeout: 40000
- extendedWaitUntil:
    visible: '.*CanTopo 021L1.*'
    timeout: 20000
# Collections: one row per publisher (no collections.json in the fixture, so
# no Parcs Québec row).
- scrollUntilVisible:
    element:
      text: '.*NRCan CanTopo.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertNotVisible: '.*Parcs Québec.*'
# "By type" sits at the bottom. The chips' accessibility labels read
# "Topographic maps, 4" — distinct from the cards' "Topographic · …" meta
# lines, so the match can only land on the chip.
- scrollUntilVisible:
    element:
      text: 'Topographic maps.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: 'Nautical maps.*'
# Entering Topographic opens the filtered list. The tap is GUARDED on not yet
# being inside (the list's header back action, "Back", only exists there), so
# a retry can never re-tap once we are in.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Back'
          commands:
            - tapOn:
                text: 'Topographic maps.*'
                retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: 'Back'
          timeout: 20000
      - extendedWaitUntil:
          visible: '.*CanTopo 021L14.*'
          timeout: 20000
# All three Québec topo sheets, and no nautical chart: we really are inside
# Topographic.
- assertVisible: '.*CanTopo 021L11.*'
- assertVisible: '.*CanTopo 021L13.*'
- assertNotVisible: '.*Chart 14771.*'
# A row opens the map's detail page: the free download, the offline format.
- tapOn: '.*CanTopo 021L13.*'
- extendedWaitUntil:
    visible: 'Download · Free'
    timeout: 15000
- assertVisible: 'GeoPDF · works offline'
- assertNotVisible: '.*Buy.*'
# Detail → list → landing.
- tapOn: 'Back'
- extendedWaitUntil:
    visible: '.*CanTopo 021L11.*'
    timeout: 15000
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Search maps'
    timeout: 15000
# Diacritic-folded text search from the landing: "raymond" keeps
# Saint-Raymond, drops Québec.
- tapOn: 'Search maps'
- inputText: 'raymond'
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
- assertNotVisible: '.*CanTopo 021L14.*'
- assertNotVisible: '.*CanTopo 021L11.*'
# Search-digest proof, on a device: a term the catalog genuinely lacks must
# produce the TRUE empty state. The screen is only allowed to say this once the
# digest has been fetched and reported that no shard anywhere could match —
# without it the query has only seen the shards loaded for this area, and the
# screen says so and offers "Search the whole catalog" instead.
- eraseText: 50
- inputText: 'kilimanjaro'
- extendedWaitUntil:
    visible: 'No maps match your search.'
    timeout: 20000
- eraseText: 50
- inputText: 'raymond'
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
- hideKeyboard
# Download → destination dialog (defaults to Ungrouped) → Add.
- tapOn: 'Download'
- extendedWaitUntil:
    visible: 'Add to Library'
    timeout: 10000
- assertVisible: 'Ungrouped'
- tapOn: 'Add'
# The fixture zip is ~1 KB, but the emulator still has to fetch, unzip, parse
# and persist it — the success snackbar names the map.
- extendedWaitUntil:
    visible: '.*added to Library.*'
    timeout: 60000
# Dedup: the row now offers the sage "Downloaded" (opens the map) instead of
# Download.
- extendedWaitUntil:
    visible: 'Downloaded.*'
    timeout: 10000
# The downloaded sheet must be a regular Library map.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*CanTopo 021L13.*'
    timeout: 15000
# Back to the map tab so later flows start from the usual place.
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
