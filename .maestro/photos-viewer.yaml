# Trail photos e2e (#587): a trail photo opens its bottom card (the photo,
# when and where, the team's comments, and for my own photos Caption / Share
# / Hide / Remove); caption it from the card and close it. There is no
# full-screen viewer (owner 2026-10-07: "I hate that view. forget it.").
#
# Portability notes:
# - Runs after photos-add.yaml (the newest trail has at least one photo).
# - The strip's cards are "Photo N of M: <caption or time>".
appId: com.inukshuk.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- assertVisible: 'Recorded trails.*'
- tapOn: '.* — open trail view, long-press to select'
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 30000
- tapOn: 'Overview'
- scrollUntilVisible:
    element: 'Photo 1 of [0-9]+.*'
    direction: DOWN
    timeout: 15000
# The second photo when there is one (the CI fixtures land as one photo or
# two; the old viewer captioned the second the same way).
- runFlow:
    when:
      visible: 'Photo 2 of [0-9]+.*'
    commands:
      - tapOn: 'Photo 2 of [0-9]+.*'
- runFlow:
    when:
      notVisible:
        id: 'photo-card'
    commands:
      - tapOn: 'Photo 1 of [0-9]+.*'
- extendedWaitUntil:
    visible:
      id: 'photo-card'
    timeout: 15000
# A swipe up stays on the card (it no longer opens anything).
- swipe:
    from:
      id: 'photo-card-image'
    direction: UP
- assertVisible:
    id: 'photo-card'
- assertNotVisible: 'Show on map'
# Caption it, in the card.
- tapOn:
    id: 'photo-card-caption'
- tapOn:
    id: 'photo-card-caption-input'
- eraseText: 60
- inputText: 'Lichen glade'
- tapOn:
    id: 'photo-card-caption-save'
- extendedWaitUntil:
    visible: 'Lichen glade'
    timeout: 10000
- tapOn:
    id: 'photo-card-close'
- assertNotVisible:
    id: 'photo-card'
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 15000
