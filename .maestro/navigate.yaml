# Navigate to a point e2e (#672): a long-pressed spot's card → Navigate enters
# navigation mode straight away (no coordinates dialog any more): the
# destination chip with its ✕ is up, and the ✕ ends it.
#
# Portability notes (same rules as convert.yaml / waypoint.yaml):
# - Per-platform launchApp permission values (#128).
# - Since #757 c the long-press opens a docked card whose grid buttons are
#   real, accessible views: tapped by id, no screen-percentage guesses.
# - The linear compass itself is not asserted: it needs a compass heading
#   (or walking, for the course-over-ground fallback), and neither emulator
#   nor simulator promises one. Jest covers the tape (NavCompass.test.tsx).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
# A long-press opens the point's card (#757 c), docked at the bottom with its
# grid (Waypoint, Navigate, Copy, Convert, Share): real, accessible buttons.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Clear destination'
          commands:
            - longPressOn:
                point: '50%,50%'
            - extendedWaitUntil:
                visible:
                  id: 'point-card'
                timeout: 5000
            - tapOn:
                id: 'point-card-navigate'
      - extendedWaitUntil:
          visible: 'Clear destination'
          timeout: 10000
# Navigation mode, not the old coordinates dialog.
- assertNotVisible: 'Navigate to coordinates'
- tapOn: 'Clear destination'
- extendedWaitUntil:
    notVisible: 'Clear destination'
    timeout: 10000
- assertVisible: 'Map actions'
