# Standalone waypoint e2e (#135, one-tap since #671): "Pin my location" in
# the "+" menu (2.5's "Add waypoint", renamed by #709; "Add waypoint" now
# drops at the centre cursor) saves a waypoint at the GPS fix straight away
# and shows a snackbar with EDIT and UNDO. The flow opens the editor from EDIT, annotates and
# saves, then drops a SECOND waypoint and asserts its auto number is higher
# ("Waypoint N+…") — only true if the first one reached the persisted store.
# It ends by deleting every waypoint it dropped (see the tidy-up at the end).
#
# Why not re-open the pin to check the note? Neither driver can target it:
# the pins are MapLibre symbols (#675), with no view and no a11y node, and on
# iOS the map view masks its children from XCUITest anyway; blind coordinate
# taps were tried and are flaky because the camera follows the runner's
# alternating geo-fix loop (~86 m oscillation).
#
# Portability notes (same rules as smoke.yaml / record.yaml):
# - Per-platform launchApp permission values (#128).
# - The editor is a bottom sheet titled "Waypoint"; its name field holds
#   "Waypoint N", the note input is labelled "Note"; save is "Done" (header
#   and footer both save), discard is "Delete".
# - A waypoint needs a GPS fix: before one, "Pin my location" only shows the
#   "Waiting for a GPS fix…" snackbar — the retry blocks simply try again.
# - The EDIT/UNDO snackbar lives 8 s. A retry after a missed EDIT drops one
#   more waypoint, which is why the second number is checked with ">" and
#   not "== n1 + 1".
# - The note is a single token: iOS autocorrect rewrites multi-word input.
# - The editor does not focus the note by itself (#675), so there is no
#   keyboard to hide until a field is tapped; hideKeyboard is Android-only
#   and, with no keyboard up, Maestro's Android hideKeyboard presses BACK,
#   which closes the sheet — so it only follows typing.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
# Open the dial and drop the first waypoint, then open it from the snackbar's
# EDIT. Retries absorb the cold-start tap race and the no-fix-yet snackbar.
# The dial tap is GUARDED (only when the actions aren't visible): a blind
# re-tap on retry toggled a slow-but-open dial closed again.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Pin my location'
          commands:
            - tapOn: 'Map actions'
      # 60 s: on software-GL emulators one hierarchy fetch can take that long.
      - extendedWaitUntil:
          visible: 'Pin my location'
          timeout: 60000
      - tapOn: 'Pin my location'
      - extendedWaitUntil:
          visible: 'Waypoint \d+ added at your position.*'
          timeout: 8000
      - tapOn: 'Edit|EDIT'
      - extendedWaitUntil:
          visible: 'Note'
          timeout: 8000
# Editor is up on the saved waypoint: remember N, type a note and save.
- copyTextFrom: 'Waypoint \d+'
- evalScript: ${output.n1 = parseInt(maestro.copiedText.replace(/\D+/g, ''))}
- tapOn: 'Note'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'Lookout42'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: 'Done'
- extendedWaitUntil:
    notVisible: 'Note'
    timeout: 60000
# Drop a second waypoint: its number must be higher, proving the first one
# landed in the persisted store (the auto label is derived from it).
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Pin my location'
          commands:
            - tapOn: 'Map actions'
      - extendedWaitUntil:
          visible: 'Pin my location'
          timeout: 60000
      - tapOn: 'Pin my location'
      - extendedWaitUntil:
          visible: 'Waypoint \d+ added at your position.*'
          timeout: 8000
      - tapOn: 'Edit|EDIT'
      - extendedWaitUntil:
          visible: 'Note'
          timeout: 8000
- copyTextFrom: 'Waypoint \d+'
- evalScript: ${output.n2 = parseInt(maestro.copiedText.replace(/\D+/g, ''))}
- assertTrue: ${output.n2 > output.n1}
# Tidy up: delete the second waypoint from its editor (Delete closes the
# sheet's scroll, below the colours and sizes) and confirm the map is back.
- scrollUntilVisible:
    element: 'Delete'
    direction: DOWN
    timeout: 20000
- tapOn: 'Delete'
- extendedWaitUntil:
    notVisible: 'Delete'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 60000
# …and every other waypoint this flow dropped (the first one, and any a retry
# added), from the Library. A pin left at the fix sits where navigate.yaml,
# next in this shard, long-presses the map centre — and a long-press on a
# saved pin starts Move (#676) instead of opening the coordinates chip.
# Same row idiom as heatmap.yaml: long-press → "Delete waypoint" → confirm.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Import'
    timeout: 15000
- repeat:
    times: 8
    while:
      visible: 'Waypoint \d+.*'
    commands:
      - longPressOn: 'Waypoint \d+.*'
      - extendedWaitUntil:
          visible: 'Delete waypoint'
          timeout: 8000
      - tapOn: 'Delete waypoint'
      # Confirm dialog: title 'Delete waypoint', buttons Cancel / Delete —
      # 'Delete' matches only the button (Maestro text match is exact).
      - extendedWaitUntil:
          visible: 'Cancel'
          timeout: 8000
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Cancel'
          timeout: 8000
- assertNotVisible: 'Waypoint \d+.*'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
