# Geodetic points extension e2e: Settings → Extensions → Get installs it
# from its collapsed one-line row (the switch takes Get's place), tapping the
# row expands its details (offline, coverage, remove), and the overlays
# sheet's Extensions tab then carries the "Geodetic points" switch.
# Leaves the extension removed again so other flows see the default state.
#
# iOS merges a row's title + subtitle into one accessibility string, so row
# matches are wildcard regexes (see settings.yaml).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
# The Library header's Settings button: wait for it, the tab switch may
# still be settling (CI 2026-10-06: an immediate tap found nothing).
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Geodetic points.*'
          commands:
            - tapOn: 'Extensions.*'
      - extendedWaitUntil:
          visible: 'Geodetic points.*'
          timeout: 5000
# Start from "not installed" whatever a previous run left (installed, the
# collapsed row shows its switch instead of Get).
- runFlow:
    when:
      visible: 'Show geodetic points'
    commands:
      - tapOn:
          id: 'extension-row-geodetic'
      - scrollUntilVisible:
          element: 'Remove Geodetic points extension'
          direction: DOWN
      - tapOn: 'Remove Geodetic points extension'
      - tapOn: 'Remove'
- scrollUntilVisible:
    element: 'Get Geodetic points'
    direction: DOWN
- tapOn: 'Get Geodetic points'
# Get works from the collapsed row, which stays collapsed.
- extendedWaitUntil:
    visible: 'Show geodetic points'
    timeout: 10000
- assertNotVisible: 'Coverage & sources.*'
# Tapping the row expands its details.
- tapOn:
    id: 'extension-row-geodetic'
- extendedWaitUntil:
    visible: 'Coverage & sources.*'
    timeout: 10000
- assertVisible: 'Offline in your regions.*'
- scrollUntilVisible:
    element: 'Remove Geodetic points extension'
    direction: DOWN
- tapOn: 'Back'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- tapOn: 'Map overlays'
# Installed extensions live in the sheet's Extensions tab.
- tapOn: 'Extensions tab'
- assertVisible: 'Geodetic points'
- assertVisible: 'Get more extensions'
- tapOn: 'Close overlays'
# Leave it uninstalled.
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
# The Library header's Settings button: wait for it, the tab switch may
# still be settling (CI 2026-10-06: an immediate tap found nothing).
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Geodetic points.*'
          commands:
            - tapOn: 'Extensions.*'
      - extendedWaitUntil:
          visible: 'Geodetic points.*'
          timeout: 5000
# Every visit starts collapsed: expand it to reach Remove.
- tapOn:
    id: 'extension-row-geodetic'
- extendedWaitUntil:
    visible: 'Coverage & sources.*'
    timeout: 5000
- scrollUntilVisible:
    element: 'Remove Geodetic points extension'
    direction: DOWN
- tapOn: 'Remove Geodetic points extension'
- tapOn: 'Remove'
- extendedWaitUntil:
    visible: 'Get Geodetic points'
    timeout: 5000
