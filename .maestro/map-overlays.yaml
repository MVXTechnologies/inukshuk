# Main-map terrain overlays e2e (1.2.0, reworked for the D-6 drill-down):
# open the Overlays menu, drill into the Topology group, enable Slope +
# Contours with their selectors (slope-angle floor, contour interval) and
# confirm the 2D map stays alive. Crash-detection focus, like trail-view.yaml.
# (The main-map 3D segment was removed with the 2026-07-24 rollback — the
# focused trail viewer's 3D is covered by trail-view.yaml.)
#
# Portability notes:
# - Runs standalone (needs no saved trail); geo comes from the launch
#   permission + the workflow's geo-fix feed.
# - The overlays menu is a plain-View dark drill-down sheet under the "Map
#   overlays" rail button: top level shows the Topology / Weather / Marine
#   group rows; 'Topology' is the open-state sentinel (it exists nowhere
#   outside the open menu). Tapping it swaps the sheet content in place (no
#   animation), so the row taps after the sentinel wait are safe.
# - Guarded-tap idiom on the opener (tap only while 'Topology' is not
#   visible) so a retry can never toggle an open sheet closed.
# - Sub-menu rows are plain visible-text matches; the slope window is a
#   two-thumb range slider (its container a11y label is asserted, not
#   dragged — thumb pans are flake bait).
# - Slope's one-time disclaimer snackbar may cover the bottom of the screen;
#   it auto-dismisses and nothing below asserts during that window.
# - A far-left tap lands on the sheet's dismiss backdrop and only closes the
#   menu (see trail-view.yaml).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# --- 2D: drill into Topology, enable both overlays, drive both selectors ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Topology.*'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Topology.*'
          timeout: 10000
- tapOn: 'Topology.*'
- extendedWaitUntil:
    visible: 'Slope'
    timeout: 10000
- tapOn: 'Contours'
- extendedWaitUntil:
    visible: '50 m'
    timeout: 10000
- tapOn: '50 m'
- tapOn: 'Auto'
- tapOn: 'Slope'
# The range slider renders its committed window; default = every band. Assert
# its container a11y label — iOS collapses the inner value text ("27–90°")
# into the accessible container, so the glyph text is Android-only.
- extendedWaitUntil:
    visible: 'Slope range 27 to 90 degrees'
    timeout: 10000
# Close the menu via the backdrop; the map beneath must still be responsive
# while the overlay computes (DEM fetch + raster/contour build are async).
- tapOn:
    point: 50%,8%
- assertVisible: 'Map actions'
# Leave the overlays off so reruns and later flows start from the default map.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Topology.*'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Topology.*'
          timeout: 10000
- tapOn: 'Topology.*'
- extendedWaitUntil:
    visible: 'Slope'
    timeout: 10000
- tapOn: 'Slope'
- tapOn: 'Contours'
- tapOn:
    point: 50%,8%
- assertVisible: 'Map actions'
