# Main-map terrain overlays e2e (1.2.0; reworked for the D-6 drill-down, then
# for the #484 single-sheet redesign): open the Overlays sheet, enable Slope +
# Contours with their selectors (slope window, contour density) and confirm
# the 2D map stays alive. Crash-detection focus, like trail-view.yaml.
#
# Portability notes:
# - Runs standalone (needs no saved trail); geo comes from the launch
#   permission + the workflow's geo-fix feed.
# - The overlays menu is ONE themed plain-View sheet under the "Map overlays"
#   rail button (#484), in four tabs (Map · Terrain · Sports · Extensions,
#   'Map tab'… labels; it reopens on the last one): Switch
#   rows and segmented level pickers, scrolling inside a capped height. Its ✕
#   ('Close overlays') is the open-state sentinel — it exists nowhere outside
#   the open sheet. The sheet mounts fresh (scrolled to the top) on each open.
# - Guarded-tap idiom on the opener (tap only while 'Close overlays' is not
#   visible) so a retry can never toggle an open sheet closed.
# - Terrain and Live layers sit below the fold: scrollUntilVisible swipes at
#   the screen centre, which is inside the sheet. The slope window is a
#   two-thumb range slider (its thumbs' a11y labels are asserted, not dragged
#   — thumb pans are flake bait).
# - Slope's one-time disclaimer snackbar may cover the bottom of the screen;
#   it auto-dismisses and nothing below asserts during that window.
# - Weather and Marine are PARKED behind WEATHER_ENABLED / MARINE_ENABLED in
#   src/core/features/flags.ts. Their rows stay visible but disabled with a
#   "Coming soon" hint, and this flow asserts exactly that — the parked
#   state is shipped behaviour, so it gets coverage like any other. When a
#   flag flips back to true, delete the parked-row block below (marked) and
#   re-enable .maestro/weather.yaml / .maestro/marine.yaml (their rows now
#   need a scrollUntilVisible too).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# --- Open the sheet (guarded) ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
# The sheet has four tabs (Map · Terrain · Sports · Extensions) and reopens
# on the last one: pick each section's tab explicitly.
- tapOn: 'Map tab'
# --- 'PDF maps' master switch (#233), first section. It is a switch row (a11y
# label 'PDF maps', trailing .* for iOS merged strings) whose OFF state is
# explained by a 'Hidden on the map' hint under the label. The switch is
# PERSISTED, so it starts at whatever a previous run left it at: tap once,
# and if the hint now shows the switch went OFF — prove it, then tap again so
# the run ends with the maps ON (a later flow must never inherit a map with
# its sheets hidden). If the hint does not show, the switch was OFF and the
# tap turned it on — also the state to leave behind.
- assertVisible: 'PDF maps.*'
- tapOn: 'PDF maps.*'
- runFlow:
    when:
      visible: 'Hidden on the map.*'
    commands:
      - tapOn: 'PDF maps.*'
- assertNotVisible: 'Hidden on the map.*'
- assertVisible: 'PDF maps.*'
# --- Terrain: Contours with its density, Slope with its window ---
- tapOn: 'Terrain tab'
- scrollUntilVisible:
    element: 'Slope'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: 'Contours'
- extendedWaitUntil:
    visible: '50 m'
    timeout: 10000
- tapOn: '50 m'
- tapOn: 'Auto'
- tapOn: 'Slope'
# The range slider renders its committed window; default = every band. Since
# 31b811e (#308) each thumb is its own adjustable a11y element labelled
# '<label> minimum' / '<label> maximum' — the container is no longer an
# element, so there is no whole-range label to match. The thumbs are separate
# elements on both platforms, but they read differently: Android folds
# accessibilityValue.text into the content description ("Slope minimum,
# 27°"), iOS keeps the label bare and carries the value separately. The
# trailing .* matches both; the default window itself is pinned on Android,
# where the value is part of the matchable string.
- extendedWaitUntil:
    visible: 'Slope minimum.*'
    timeout: 10000
- assertVisible: 'Slope maximum.*'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: 'Slope minimum, 27°'
      - assertVisible: 'Slope maximum, 90°'
# --- Parked features (src/core/features/flags.ts): Weather and Marine stay
# at the bottom of the sheet, greyed, with a "Coming soon" hint. Assert the
# a11y LABELS, not the visible hint text: the rows set `accessible`, which
# merges each into one element whose label is authoritative on both
# platforms. The trailing .* covers iOS merging extra state into the string.
- tapOn: 'Sports tab'
- scrollUntilVisible:
    element: 'Marine.*coming soon.*'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Weather.*coming soon.*'
- assertVisible: 'Marine.*coming soon.*'
# Disabled means disabled: tapping the parked Weather row must NOT open the
# weather list. The sheet staying on its rows (no list back button) is the
# proof.
- tapOn: 'Weather.*coming soon.*'
- assertVisible: 'Close overlays'
- assertNotVisible: 'Back to overlays'
# Close the sheet with its ✕; the map beneath must still be responsive while
# the overlay computes (DEM fetch + raster/contour build are async).
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
# Leave the overlays off so reruns and later flows start from the default map.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
- tapOn: 'Terrain tab'
- scrollUntilVisible:
    element: 'Slope'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: 'Slope'
- tapOn: 'Contours'
# An outside tap lands on the rail's backdrop and only closes the sheet.
- tapOn:
    point: 50%,8%
- assertVisible: 'Map actions'
