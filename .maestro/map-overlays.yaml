# Main-map terrain overlays e2e (1.2.0; reworked for the D-6 drill-down, then
# for the #484 single-sheet redesign): open the Overlays sheet, enable Slope +
# Contours with their selectors (slope window, contour density) and confirm
# the 2D map stays alive. Crash-detection focus, like trail-view.yaml.
#
# Portability notes:
# - Runs standalone (needs no saved trail); geo comes from the launch
#   permission + the workflow's geo-fix feed.
# - The overlays menu is ONE themed plain-View sheet under the "Map overlays"
#   rail button (#484; titled "Map layers" since #669, the handles are
#   unchanged), in four tabs (Map · Terrain · Sports · Extensions,
#   'Map tab'… labels; it reopens on the last one): Switch
#   rows and segmented level pickers, scrolling inside a capped height. An
#   item with options of its own opens them as a sub-panel ('Options for
#   <item>' accessory, 'Back to overlays' back row; #668). Its ✕
#   ('Close overlays') is the open-state sentinel — it exists nowhere outside
#   the open sheet. The sheet mounts fresh (scrolled to the top) on each open.
# - Guarded-tap idiom on the opener (tap only while 'Close overlays' is not
#   visible) so a retry can never toggle an open sheet closed.
# - Never act on a state the app has not drawn yet. The CI emulator renders
#   at seconds per frame, and Maestro calls a screen settled when nothing
#   changes, so a tap's re-render can land well after the tap "completes".
#   Two rules follow (2.5.2 run 38521047124 broke both):
#   * A persisted switch is driven as: bring it to a known state, waiting
#     for the hint to follow, then flip it and WAIT (extendedWaitUntil) for
#     the hint. Never "tap, then tap again if the hint still shows": under
#     lag the second tap undoes the first once both are drawn.
#   * After a tab tap, wait for that tab's own content before any swipe.
#     The sheet reopens on its last tab, and the Sports tab is one row: a
#     swipe from the screen centre made while that short sheet is still
#     drawn starts on the backdrop, and a backdrop press closes the sheet.
# - Terrain and Live layers sit below the fold: scrollUntilVisible swipes at
#   the screen centre, which is inside the sheet. The slope window is a
#   two-thumb range slider (its thumbs' a11y labels are asserted, not dragged
#   — thumb pans are flake bait).
# - Slope's one-time disclaimer snackbar may cover the bottom of the screen;
#   it auto-dismisses and nothing below asserts during that window.
# - Weather and Marine are PARKED behind WEATHER_ENABLED / MARINE_ENABLED in
#   src/core/features/flags.ts. Since 2.5.1 their rows are not shown at all
#   (the owner's rule: no greyed-out rows), and this flow asserts exactly
#   that — the parked state is shipped behaviour, so it gets coverage like
#   any other. When a flag flips back to true, delete the parked-row block
#   below (marked) and re-enable .maestro/weather.yaml / .maestro/marine.yaml
#   (their rows need a scrollUntilVisible).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# --- Open the sheet (guarded) ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
# The sheet has four tabs (Map · Terrain · Sports · Extensions) and reopens
# on the last one: pick each section's tab explicitly.
- tapOn: 'Map tab'
# --- 'PDF maps' master switch (#233), first section. It is a switch row (a11y
# label 'PDF maps', trailing .* for iOS merged strings) whose OFF state is
# explained by a 'Hidden on the map' hint under the label. The switch is
# PERSISTED, so it starts at whatever a previous run left it at: bring it ON,
# turn it OFF and prove the hint, then back ON so the run ends with the maps
# shown (a later flow must never inherit a map with its sheets hidden). Each
# flip waits for the hint (see the header's lag rules).
- extendedWaitUntil:
    visible: 'PDF maps.*'
    timeout: 10000
# The hint is drawn with its row, so this reads a settled state: if the maps
# are OFF, turn them on and wait until the hint is gone.
- runFlow:
    when:
      visible: 'Hidden on the map.*'
    commands:
      - tapOn: 'PDF maps.*'
      - extendedWaitUntil:
          notVisible: 'Hidden on the map.*'
          timeout: 10000
- tapOn: 'PDF maps.*'
- extendedWaitUntil:
    visible: 'Hidden on the map.*'
    timeout: 10000
- tapOn: 'PDF maps.*'
- extendedWaitUntil:
    notVisible: 'Hidden on the map.*'
    timeout: 10000
- assertVisible: 'PDF maps.*'
# --- PDF maps' sub-panel (#670): its round accessory ('Options for PDF
# maps', never starting with the row's label, so 'PDF maps.*' above still
# finds the row) opens a page with the tab strip hidden and See-through white
# always enabled. Its back row ('Back to overlays') returns to the Map tab.
- tapOn: 'Options for PDF maps'
- extendedWaitUntil:
    visible: 'See-through white.*'
    timeout: 10000
- assertNotVisible: 'Terrain tab'
- tapOn: 'Back to overlays'
- extendedWaitUntil:
    visible: 'Terrain tab'
    timeout: 10000
# --- Pointing line (#681), under Map aids on the Map tab: its accessory
# ('Options for pointing line') opens a page whose first row is 'Show
# pointing line', hinted 'Hidden on the map' while off. It is PERSISTED and
# off by default: make sure it is on, then turn it off and prove it, so the
# run leaves the default behind.
- scrollUntilVisible:
    element: 'Options for pointing line'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: 'Options for pointing line'
- extendedWaitUntil:
    visible: 'Show pointing line.*'
    timeout: 10000
- assertNotVisible: 'Terrain tab'
- runFlow:
    when:
      visible: 'Hidden on the map.*'
    commands:
      - tapOn: 'Show pointing line.*'
      - extendedWaitUntil:
          notVisible: 'Hidden on the map.*'
          timeout: 10000
- tapOn: 'Show pointing line.*'
- extendedWaitUntil:
    visible: 'Hidden on the map.*'
    timeout: 10000
- tapOn: 'Back to overlays'
- extendedWaitUntil:
    visible: 'Terrain tab'
    timeout: 10000
# --- Terrain: the base map cards on top (#669, the rail's Base map button is
# gone), Satellite's sub-panel, then Contours with its density, Slope with its
# window. The cards are asserted, not tapped: switching to Satellite would
# leave imagery (network tiles) for later flows.
- tapOn: 'Terrain tab'
- extendedWaitUntil:
    visible: 'Map, Trails, contours, names.*'
    timeout: 10000
- assertVisible: 'Satellite, Aerial imagery.*'
- tapOn: 'Options for Satellite'
- extendedWaitUntil:
    visible: 'Labels on satellite.*'
    timeout: 10000
- tapOn: 'Back to overlays'
- extendedWaitUntil:
    visible: 'Terrain tab'
    timeout: 10000
- scrollUntilVisible:
    element: 'Slope'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: 'Contours'
- extendedWaitUntil:
    visible: '50 m'
    timeout: 10000
- tapOn: '50 m'
- tapOn: 'Auto'
- tapOn: 'Slope'
# The range slider renders its committed window; default = every band. Since
# 31b811e (#308) each thumb is its own adjustable a11y element labelled
# '<label> minimum' / '<label> maximum' — the container is no longer an
# element, so there is no whole-range label to match. The thumbs are separate
# elements on both platforms, but they read differently: Android folds
# accessibilityValue.text into the content description ("Slope minimum,
# 27°"), iOS keeps the label bare and carries the value separately. The
# trailing .* matches both; the default window itself is pinned on Android,
# where the value is part of the matchable string.
- extendedWaitUntil:
    visible: 'Slope minimum.*'
    timeout: 10000
- assertVisible: 'Slope maximum.*'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: 'Slope minimum, 27°'
      - assertVisible: 'Slope maximum, 90°'
# --- Parked features (src/core/features/flags.ts): Weather and Marine have
# no row at all on the Sports tab (no greyed "Coming soon" rows, 2.5.1).
# The heatmap row is the tab's last row: once it is up, the whole tab is.
- tapOn: 'Sports tab'
# One row, never below the fold: wait for it, never swipe (see the header).
- extendedWaitUntil:
    visible: 'Personal heatmap.*'
    timeout: 10000
- assertNotVisible: 'Weather.*'
- assertNotVisible: 'Marine.*'
- assertNotVisible: '.*[Cc]oming soon.*'
- assertVisible: 'Close overlays'
# Close the sheet with its ✕; the map beneath must still be responsive while
# the overlay computes (DEM fetch + raster/contour build are async).
- tapOn: 'Close overlays'
- assertVisible: 'Map actions'
# Leave the overlays off so reruns and later flows start from the default map.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
- tapOn: 'Terrain tab'
# It reopened on the one-row Sports tab: wait for the Terrain tab to be drawn.
- extendedWaitUntil:
    visible: 'Satellite, Aerial imagery.*'
    timeout: 10000
- scrollUntilVisible:
    element: 'Slope'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: 'Slope'
- tapOn: 'Contours'
# An outside tap lands on the rail's backdrop and only closes the sheet.
- tapOn:
    point: 50%,8%
- assertVisible: 'Map actions'
