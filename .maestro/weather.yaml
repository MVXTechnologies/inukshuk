# Weather UX v2 (M1, reworked in wave A) e2e: open the Overlays menu, pick a
# weather layer from the icon picker, confirm the bottom time scrubber
# appears, scrub forward, flip playback from the scrubber's play button (the
# one and only animation control since wave A — the dialog's Animate checkbox
# is gone), long-press for the forecast card and confirm the 2D map stays
# alive throughout. Crash-detection focus, like map-overlays.yaml — NEVER
# asserts weather pixels, scrubber times or forecast content.
#
# Portability notes:
# - Network-independent by design: in CI the GeoMet WMS host is unreachable,
#   tile fetches fail and the map degrades to the (muted) basemap it already
#   tolerates; the timeline's GetCapabilities fetch fails and the scrubber
#   runs on its clock-guessed timeline; playback steps that timeline with
#   nothing to draw; the forecast card renders its "needs a connection"
#   state; the tap-anywhere point chip settles to "No data". Nothing below
#   asserts any network-dependent pixels — only menu state, the (purely
#   local) scrubber chrome, and the crash gate.
# - The weather picker is a paper Dialog of icon rows; rows carry their label
#   as accessibilityLabel. iOS merges an element's title+description into one
#   accessible text, so matchers for dialog rows and the scrubber wrap in
#   leading/trailing `.*`. Catalog labels are regex-metacharacter-free (see
#   weatherLayers.test.ts).
# - Open-state sentinels must not echo text visible while the dialog is
#   closed: 'Rain radar' only exists inside the dialog while no radar layer
#   is selected, so it gates the temperature pick; 'Snow radar' gates the
#   pick while 'Weather: Rain radar' is on the menu row behind.
# - A far-left tap lands on the Menu's dismiss backdrop and only closes the
#   menu (see trail-view.yaml).
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# --- Open the picker and select the Temperature layer from its thumbnail row ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Weather(: .*)?'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Weather(: .*)?'
          timeout: 10000
- tapOn: 'Weather(: .*)?'
# Dialog-open sentinel: a picker row that is never visible while closed.
- extendedWaitUntil:
    visible: '.*Rain radar.*'
    timeout: 10000
- tapOn: '.*Temperature.*'
- tapOn: 'Done'
# --- The bottom time scrubber must be up whenever a weather layer is on;
# scrubbing must not kill the map. Tapping the track's centre IS a scrub —
# the forecast timeline opens at "now" (far left), so centre = ~+24 h. ---
- extendedWaitUntil:
    visible: '.*Weather timeline.*'
    timeout: 10000
- tapOn: '.*Weather timeline.*'
- assertVisible: 'Map actions'
- assertVisible: '.*Weather timeline.*'
# --- Forecast tap-card: long-press must never crash, with or without
# network. A later bare map tap dismisses the card AND (wave A item 7) drops
# the point-value chip at the tapped spot — offline it settles to "No data";
# this stays a crash gate, never a content assert. ---
- longPressOn:
    point: 50%,40%
- assertVisible: 'Map actions'
- tapOn:
    point: 50%,30%
- assertVisible: 'Map actions'
# --- Switch to a radar layer: the scrubber must survive the forecast→past
# timeline seam, and playback (the scrubber's play button) must degrade to a
# no-op offline. ---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Weather: Temperature'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Weather: Temperature'
          timeout: 10000
- tapOn: 'Weather: Temperature'
# Open sentinel while 'Weather: Temperature' shows on the (closed) menu row:
# 'Snow radar' never appears outside the dialog.
- extendedWaitUntil:
    visible: '.*Snow radar.*'
    timeout: 10000
- tapOn: '.*Rain radar.*'
- tapOn: 'Done'
- extendedWaitUntil:
    visible: '.*Weather timeline.*'
    timeout: 10000
# Playback on, from the scrubber's play disc (its label flips to the pause
# label while playing — that flip is also the "it engaged" signal). Playback
# state PERSISTS across a layer switch — if the earlier layer left it
# playing, the disc already reads Pause; only tap Play when it shows Play.
- runFlow:
    when:
      notVisible: '.*Pause weather timeline.*'
    commands:
      - tapOn: '.*Play weather timeline.*'
- extendedWaitUntil:
    visible: '.*Pause weather timeline.*'
    timeout: 10000
- assertVisible: 'Map actions'
# --- Everything back off so reruns and later flows start from the default
# map: pause playback first (it is transient but this run keeps going),
# then None. ---
- runFlow:
    when:
      visible: '.*Pause weather timeline.*'
    commands:
      - tapOn: '.*Pause weather timeline.*'
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Weather: Rain radar'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Weather: Rain radar'
          timeout: 10000
- tapOn: 'Weather: Rain radar'
# Open sentinel while 'Weather: Rain radar' shows on the (closed) menu row:
# 'Snow radar' never appears outside the dialog.
- extendedWaitUntil:
    visible: '.*Snow radar.*'
    timeout: 10000
- tapOn: '.*None.*'
- tapOn: 'Done'
- assertVisible: 'Map actions'
- assertNotVisible: '.*Weather timeline.*'
