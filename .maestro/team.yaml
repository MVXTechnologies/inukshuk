# Team mode e2e (#589), founder side, on the loopback mesh: a build made with
# EXPO_PUBLIC_MESH_LOOPBACK=1 (the E2E APK sets it in .github/workflows/e2e.yml)
# runs simulated teammates' phones inside the app over an in-memory LAN, with
# the real protocol (join, safety code, sync, removal and key rotation).
#
# Settings → Extensions → Get Team mode → Create a team → share my position →
# Invite (QR) → a simulated teammate joins with it (safety code on the admin's
# screen) → their message reaches the chat → I reply → remove them (the key
# rotates at once) → the team chip on the map → leave the team.
#
# Settings rows merge title + subtitle on iOS: their matches are wildcard
# regexes (maestro-ios-tap-traps). The accordion opener is guarded.
appId: com.inukshuk.app
tags:
  - clean-state
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
            notifications: allow
# A clean start: the runner clears the app's data before every attempt (the
# `clean-state` tag), so no team, join or invite is left over from an earlier
# flow or a failed attempt. Android's one-time "Viewing full screen" hint can
# then sit over the map.
- tapOn:
    text: 'Got it'
    optional: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- setLocation:
    latitude: 47.0745
    longitude: -70.9065
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 15000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Extensions.*'
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: '.*Team mode.*'
          commands:
            - tapOn: 'Extensions.*'
      - scrollUntilVisible:
          element: '.*Team mode.*'
          direction: DOWN
          timeout: 5000
# Compact list (#633): a one-line row, Get before the install and its switch
# after; the team rows are in its details, opened by tapping the row (only
# when they are closed: a second tap would close them again).
- scrollUntilVisible:
    element:
      id: 'extension-row-team'
    direction: DOWN
- runFlow:
    when:
      visible: 'Get Team mode'
    commands:
      - tapOn: 'Get Team mode'
- runFlow:
    when:
      notVisible:
        id: 'extension-details-team'
    commands:
      - tapOn:
          id: 'extension-row-team'
- scrollUntilVisible:
    element:
      id: 'team-create-row'
    direction: DOWN
- tapOn:
    id: 'team-create-row'
# Create.
- extendedWaitUntil:
    visible:
      id: 'team-create-screen'
    timeout: 10000
- tapOn:
    id: 'team-create-name'
- inputText: 'Releve MSA'
- tapOn:
    id: 'team-create-myname'
- eraseText: 40
- inputText: 'Marc'
- hideKeyboard
- tapOn:
    id: 'team-create-ends-14d'
- tapOn:
    id: 'team-create-submit'
# The first team makes this phone's keys, then the OS may ask for notifications once.
- extendedWaitUntil:
    visible: '(Allow|Releve MSA)'
    timeout: 40000
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 15000
- assertVisible: 'Releve MSA'
- assertVisible: '.*Off · nobody in the team sees where you are.*'
- takeScreenshot: team-hub-new
# Share my position (opt-in).
- tapOn:
    id: 'team-share-switch'
- assertVisible: '.*On while you record.*'
# Invite: the QR code.
- tapOn:
    id: 'team-invite-button'
- extendedWaitUntil:
    visible:
      id: 'team-invite-create'
    timeout: 5000
- tapOn:
    id: 'team-invite-create'
- extendedWaitUntil:
    visible:
      id: 'team-invite-qr'
    timeout: 5000
- assertVisible: '.*Single use · 48 hours · joins as member.*'
- takeScreenshot: team-invite-qr
- tapOn:
    id: 'team-invite-done'
# A simulated phone joins with a fresh invite; the admin sees its safety code.
- scrollUntilVisible:
    element:
      id: 'team-sim-add'
    direction: DOWN
- tapOn:
    id: 'team-sim-add'
- scrollUntilVisible:
    element: '.*Julie Tremblay.*'
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'team-join-notice'
    direction: UP
    timeout: 10000
- takeScreenshot: team-hub-joined
# Chat: her hello arrives; I reply.
- tapOn:
    id: 'team-chat-button'
- extendedWaitUntil:
    visible: '.*Bonjour, ici Julie Tremblay.*'
    timeout: 15000
- tapOn:
    id: 'team-chat-input'
- inputText: 'Depart 9 h au P2'
# Send with the keyboard up: the composer stays above it on both platforms.
- takeScreenshot: review-team-chat-keyboard
- tapOn:
    id: 'team-chat-send'
- extendedWaitUntil:
    visible: '.*Depart 9 h au P2.*'
    timeout: 5000
- takeScreenshot: team-chat
# The composer keeps the keyboard up after a send; close it, then leave.
- hideKeyboard:
    optional: true
- tapOn: 'Back'
# Tasks: a new task for her, in the list, ticked, under Done.
- scrollUntilVisible:
    element:
      id: 'team-tasks-row'
    direction: DOWN
- tapOn:
    id: 'team-tasks-row'
- extendedWaitUntil:
    visible:
      id: 'team-tasks-screen'
    timeout: 5000
- tapOn:
    id: 'team-task-new'
- tapOn:
    id: 'team-task-title'
- inputText: 'Check the culvert at km 2'
- hideKeyboard
- tapOn: 'Julie Tremblay'
- tapOn:
    id: 'team-task-place-none'
- tapOn:
    id: 'team-task-create'
- extendedWaitUntil:
    visible: '.*Check the culvert at km 2.*'
    timeout: 5000
- takeScreenshot: team-tasks
- tapOn:
    id: 'team-task-check'
- tapOn:
    id: 'team-task-filter-done'
- extendedWaitUntil:
    visible: '.*Check the culvert at km 2.*'
    timeout: 5000
- tapOn: 'Back'
# The comment-badge threads (12 and 100 comments on two of her photos), for
# the badge screenshot later: written now, while she is a member, and only
# now (at join time they loaded the JS thread through the checks above).
# Wait until this phone holds them all.
- scrollUntilVisible:
    element:
      id: 'team-sim-badges'
    direction: DOWN
- tapOn:
    id: 'team-sim-badges'
- scrollUntilVisible:
    element:
      id: 'team-sim-badges-done'
    direction: DOWN
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'team-member-Julie Tremblay'
    direction: UP
# Remove her: the key rotates at once (no "must be rotated" banner).
- tapOn:
    id: 'team-member-Julie Tremblay'
- extendedWaitUntil:
    visible:
      id: 'team-member-screen'
    timeout: 5000
- tapOn:
    id: 'team-member-remove'
- tapOn: 'Remove'
# Removing rotates the team key (slow on a CI emulator).
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 20000
- assertVisible: '.*Removed.*'
- assertNotVisible:
    id: 'team-needs-rotation'
# The team bar on the map (#707).
- tapOn: 'Back'
- tapOn: 'Back'
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
# Team mode: the team status bar holds the search slot (no search pill) and
# the orange team button is now the small SOS-only button.
- extendedWaitUntil:
    visible:
      id: 'team-bar-pill'
    timeout: 10000
- assertNotVisible: 'Search places'
- assertVisible:
    id: 'team-sos-button'
- takeScreenshot: team-map
# The panel (tap the pill): my status, from its actions.
- tapOn:
    id: 'team-bar-pill'
- extendedWaitUntil:
    visible:
      id: 'team-panel'
    timeout: 5000
- assertVisible:
    id: 'team-panel-manage'
- takeScreenshot: team-panel
- tapOn:
    id: 'team-panel-status'
- tapOn:
    id: 'team-status-arrived'
- extendedWaitUntil:
    notVisible:
      id: 'team-status-card'
    timeout: 5000
# SOS (#708): a plain tap only says to hold; nothing is sent.
- tapOn:
    id: 'team-sos-button'
- extendedWaitUntil:
    visible:
      id: 'team-sos-hint'
    timeout: 3000
- assertNotVisible:
    id: 'team-undo-snack'
# Hold (2 s), then the 5 s undo: Undo sends nothing. The undo's countdown
# ring animates until it ends, so Maestro's default wait for the screen to
# settle after a press outlasts the 5 s window (the SOS was already sent when
# the next step ran, local repro 2026-10-14): the presses on this live
# countdown wait at most 500 ms to settle. Even so, Maestro's release-to-tap
# time reached 5.4 s on CI (run 38750352646: the tap landed after the 5 s
# ended, so the SOS was sent) and 6.8 s locally: the E2E build's undo lasts
# 20 s (EXPO_PUBLIC_E2E_UNDO_MS), and Undo is the very next step (tapOn waits
# for it to appear). The undo's screenshot is taken on the next hold.
- longPressOn:
    id: 'team-sos-button'
    waitToSettleTimeoutMs: 500
- tapOn:
    id: 'team-undo'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: 'team-undo-snack'
    timeout: 3000
# Then longer than the armed limit and the E2E undo together (5 s + 20 s): a
# stray timer, or an Undo that came too late, shows here as an SOS band,
# never as a later flake.
- extendedWaitUntil:
    visible: 'never-shown-sentinel'
    timeout: 27000
    optional: true
- assertNotVisible:
    id: 'team-band-sos'
- assertNotVisible:
    id: 'team-undo-snack'
# Hold again and let the countdown run out (20 s in the E2E build): my SOS is
# active, in a band under the pill, until I resolve it (held, as raised).
- longPressOn:
    id: 'team-sos-button'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: 'team-undo-snack'
    timeout: 5000
- takeScreenshot: team-sos-undo
- extendedWaitUntil:
    visible:
      id: 'team-band-sos'
    timeout: 30000
- assertVisible: 'Your SOS is active'
- takeScreenshot: team-sos-active
# Resolve takes the same hold as raising (#748): hold, "Let go", release.
- longPressOn:
    id: 'team-band-sos-resolve'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: 'team-band-sos'
    timeout: 5000
# A new SOS right after a resolve goes out at once: the team's one-minute
# guard once dropped it in silence (QA 2.6.1).
- longPressOn:
    id: 'team-sos-button'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: 'team-undo-snack'
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'team-band-sos'
    timeout: 30000
- assertVisible: 'Your SOS is active'
- assertNotVisible:
    id: 'team-undo-error'
# Resolve takes the same hold as raising (#748): hold, "Let go", release.
- longPressOn:
    id: 'team-band-sos-resolve'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: 'team-band-sos'
    timeout: 5000
# Rally here (from the panel; the map has no chip row, #743): the same 5 s
# undo, then the pill's amber "!" (no gather band on the map). The pill opens
# the panel on the gather: who gets there when, and End for its creator.
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-rally'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: 'team-undo-snack'
    timeout: 5000
- assertVisible: 'Rally point at your position'
- extendedWaitUntil:
    visible:
      id: 'team-bar-gather'
    timeout: 30000
- assertNotVisible:
    id: 'team-band-gather'
- takeScreenshot: team-gather-active
- tapOn:
    id: 'team-bar-pill'
- extendedWaitUntil:
    visible:
      id: 'team-panel-gather'
    timeout: 3000
- assertVisible:
    id: 'team-gather-eta-You'
- takeScreenshot: team-gather-panel
- tapOn:
    id: 'team-panel-gather-end'
- tapOn:
    id: 'team-panel-gather-confirm-yes'
- extendedWaitUntil:
    notVisible:
      id: 'team-panel-gather'
    timeout: 5000
- tapOn:
    id: 'team-panel-close'
- extendedWaitUntil:
    notVisible:
      id: 'team-bar-gather'
    timeout: 5000
# A pin: a long-press on the map → Pin (the grid, #757), its card with the thread
# (pins are made from a spot on the map, not from a menu).
- longPressOn:
    point: '50%,55%'
- extendedWaitUntil:
    visible:
      id: 'team-press-card'
    timeout: 5000
- tapOn:
    id: 'team-press-pin'
- extendedWaitUntil:
    visible:
      id: 'team-pin-composer'
    timeout: 5000
- tapOn:
    id: 'team-pin-input'
- inputText: 'Fallen tree here'
# The composer card stays above the keyboard: tap Send itself.
- tapOn:
    id: 'team-pin-send'
- extendedWaitUntil:
    visible:
      id: 'team-pin-card'
    timeout: 5000
- assertVisible: '.*Fallen tree here.*'
- takeScreenshot: team-pin
- tapOn: 'Close'
# Team chat → Threads (the panel's Chat): the pin's conversation, apart from the channel.
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-chat'
- extendedWaitUntil:
    visible:
      id: 'team-chat-screen'
    timeout: 5000
- tapOn:
    id: 'team-chat-tab-threads'
- extendedWaitUntil:
    visible: '.*Fallen tree here.*'
    timeout: 5000
- takeScreenshot: team-threads
# The map's comment badges at two and three characters, centred.
- tapOn:
    id: 'team-thread-locate'
    childOf:
      id: 'team-thread-row'
      text: '.*Badge 100.*'
- extendedWaitUntil:
    visible: 'never-shown-sentinel'
    timeout: 4000
    optional: true
- takeScreenshot: review-team-badges
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-chat'
- tapOn:
    id: 'team-chat-tab-threads'
# A teammate's photo thread opens the photo's card on the map. Its comment
# box must stay above the keyboard: typing, then tapping Send (not Return)
# only posts when the button is not under the keys.
- tapOn:
    id: 'team-thread-row'
    text: '.*Trail sign down.*'
- extendedWaitUntil:
    visible:
      id: 'photo-card'
    timeout: 10000
- tapOn:
    id: 'team-comment-input'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: review-team-photo-card-keyboard
- inputText: 'On my way'
- tapOn:
    id: 'team-comment-send'
- extendedWaitUntil:
    visible: '.*On my way.*'
    timeout: 10000
- takeScreenshot: team-photo-card-keyboard
- runFlow:
    when:
      visible:
        id: 'photo-card-close'
    commands:
      - hideKeyboard:
          optional: true
      - tapOn:
          id: 'photo-card-close'
# Leave the team (deletes it from this phone): the panel's Manage team.
- tapOn:
    id: 'team-bar-pill'
- tapOn:
    id: 'team-panel-manage'
- extendedWaitUntil:
    visible:
      id: 'team-hub-screen'
    timeout: 5000
- scrollUntilVisible:
    element: 'Leave team'
    direction: DOWN
- tapOn: 'Leave team'
- tapOn: 'Leave'
- extendedWaitUntil:
    notVisible:
      id: 'team-hub-screen'
    timeout: 10000
