# Heatmap e2e: a second Run over the same simulated path as
# category-record's makes the shared stretch hot; tapping it opens the
# vertical activity carousel; focusing + tapping a card opens the viewer.
#
# MUST run after category-record.yaml (its Run trail is the first overlap
# partner).
#
# The heat tap is aimed, not guessed (2026-10-06 rework): both recordings
# start at the fix A = (46.8139, -71.2082), so A is where the two Runs
# overlap. The flow parks the user on A, makes sure the camera is FOLLOWING
# (the 'Locate' button's selected state — tapping it blindly toggles follow
# OFF when it is already on), and taps the centre of the map view itself
# (testID 'map-area'): while following, that centre IS the user, so the tap
# lands on A at any zoom and whatever the screen's insets. The `own-location`
# tag makes the runner (.github/scripts/e2e-attempts.sh) pause its background
# geo-fix loop for this flow: that loop alternated the user between A and a
# point ~86 m away every 2 s, which dragged the followed camera back and
# forth under the old fixed-percentage tap grid — the flake this replaces.
#
# Also runs after waypoint.yaml in the full suite, which drops "Waypoint 1"
# at the exact fix (46.8139, -71.2082) both this flow's and category-record's
# recordings start from — i.e. right where the heat tap-grid aims.
# MapScreen's tap routing checks waypoint pins BEFORE the heat lookup, and
# on-device probing confirmed the pin's hit box at this zoom fully contains
# the heat "hot" zone around that point (taps biased well outside the pin's
# hit radius land past the whole trail too — there's no dead zone between
# them to aim for). So the flow deletes that pin before recording, rather
# than trying to out-aim it.
appId: com.inukshuk.app
tags:
  - own-location
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# Delete waypoint.yaml's leftover "Waypoint 1" pin (see header note) before
# it can collide with the heat tap-grid below — via the LIBRARY, not a map
# tap: the pin's on-screen position depends on whatever camera zoom/centre a
# prior flow persisted, and a fixed-point map tap missed it as soon as the
# suite context changed (2026-08-03_123837 run: pin alive on top of the
# overlap zone at tap time). The Library card is position-independent.
# Self-healing: on a fresh install (standalone rerun) no waypoint card
# exists and the whole block is skipped. In suite context the list is short
# (1 trail, 1 waypoint) so no scrolling is needed.
- tapOn: 'Library(, tab.*)?'
- extendedWaitUntil:
    visible: 'Import'
    timeout: 15000
- runFlow:
    when:
      visible: 'Waypoint 1.*'
    commands:
      # Long-press opens the card's ⋮ menu (its a11y label documents this).
      - longPressOn: 'Waypoint 1.*'
      - extendedWaitUntil:
          visible: 'Delete waypoint'
          timeout: 8000
      - tapOn: 'Delete waypoint'
      # Confirm dialog: title 'Delete waypoint', buttons Cancel / Delete —
      # 'Delete' matches only the button (Maestro text match is exact).
      - extendedWaitUntil:
          visible: 'Cancel'
          timeout: 8000
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Cancel'
          timeout: 8000
- tapOn: 'Map(, tab.*)?'
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
# Record the second Run — same steps as category-record.yaml's record/save
# block (selectors copied verbatim, its extendedWaitUntil timeouts unchanged).
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
# Open the dial (retried whole; the tap is GUARDED — only when the actions
# aren't already visible — so a retry can never toggle an open dial closed).
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Record track'
          commands:
            - tapOn: 'Map actions'
      # 60 s for the same reason as waypoint.yaml.
      - extendedWaitUntil:
          visible: 'Record track'
          timeout: 60000
- tapOn: 'Record track'
- extendedWaitUntil:
    visible: 'What are you recording?'
    timeout: 10000
# Pick Run (not the Hike default) so the recorded track matches
# category-record's overlap partner.
- tapOn: 'Category Run(, selected)?'
- tapOn: 'Start recording'
# Background-permission rationale card on first record: decline (inline card).
# Skipped entirely when background location is already granted.
- runFlow:
    when:
      visible: 'Not now'
    commands:
      - tapOn: 'Not now'
- assertVisible: 'Stop recording'
# Root-caused via source read (src/core/geo/track/gpsFilter.ts): the recorder
# drops any fix implying > MAX_SPEED_MPS (40 m/s) from the previously ACCEPTED
# point. The background geo-fix loop (outside this flow, alternates the same
# two fixes below every ~2 s) implies ~42.5 m/s between them — just over the
# cap — so nearly every one of its own jumps gets rejected, and on-device
# evidence showed maestro's own `travel:` command (as configured here, on
# this Maestro version) also does NOT pace its fixes anywhere near its
# nominal `speed:`/distance in real wall-clock time (a `travel:` across this
# same ~85 m leg completed in ~2 s, not the ~3.4 s that 25 m/s implies), so
# its fixes get discarded by the same filter. Net effect verified two ways —
# a full heatmap.yaml run and an isolated, unmodified category-record.yaml
# run (which shares this exact travel step) — both times the recorded trail
# collapsed to "5 m", i.e. essentially nothing beyond the starting fix, so
# the two trails never share a real overlapping segment and no heat renders.
#
# Fix (scoped to this flow's own recording only — category-record.yaml and
# the shared geo loop are untouched): drive the walk ourselves with explicit
# setLocation + settle-wait pairs, fully paced by this flow rather than by
# maestro's travel timing. Interpolate the same short A<->B leg the geo loop
# also cycles (so any of the loop's own A/B injections land ON this path,
# not off it) in ~10.6 m steps; at the settle wait's observed real duration
# (~0.9-2.4 s per this flow's own prior instrumentation), that's well under
# the 40 m/s cap even in a worst case. Walk A -> B -> A so there's a dense
# cluster of real, accepted points right at the shared start fix, maximising
# the odds of landing in the same ~25 m heat grid cell (HEAT_CELL_M,
# src/core/heat/grid.ts) as category-record's own (possibly still short)
# trail there. (The geo loop is now paused for this whole flow — the
# `own-location` tag — so these fixes are the only ones the recorder sees.)
- setLocation:
    latitude: 46.813975
    longitude: -71.2081125
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.81405
    longitude: -71.208025
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.814125
    longitude: -71.2079375
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8142
    longitude: -71.20785
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.814275
    longitude: -71.2077625
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8143500
    longitude: -71.207675
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.814425
    longitude: -71.2075875
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8145
    longitude: -71.2075
- waitForAnimationToEnd:
    timeout: 1500
# ...and back, so the shared start fix collects a dense cluster of points.
- setLocation:
    latitude: 46.814425
    longitude: -71.2075875
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8143500
    longitude: -71.207675
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.814275
    longitude: -71.2077625
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8142
    longitude: -71.20785
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.814125
    longitude: -71.2079375
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.81405
    longitude: -71.208025
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.813975
    longitude: -71.2081125
- waitForAnimationToEnd:
    timeout: 1500
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: 'Stop recording'
# Stop needs a 0.8 s hold since the revamp's recording panel (no confirm
# dialog); longPressOn holds well past it.
- longPressOn: 'Stop recording'
# Recorder back to idle…
- extendedWaitUntil:
    notVisible: 'Stop recording'
    timeout: 15000
- assertVisible: 'Map actions'
# Neither recording is shown on the map yet — a fresh trail only draws once
# it's "active", and 'type' mode's activation is single-select (Library's
# "View on map" replaces, it doesn't add), so there's no way to activate BOTH
# trails through it. Switch to folder-visibility mode and check "Ungrouped"
# instead (same picker folders.yaml exercises): both trails have no folder,
# so this shows them together in one shot — the two-track overlap heat needs.
# "Ungrouped" is a CHECKBOX (tapOn toggles it), so this whole thing is only
# correct if it starts unchecked. It's whatever a previous run left it at, so
# retry the open→toggle→verify→(re-toggle if wrong) cycle: each pass flips
# the checkbox once, and re-checking "Content: 1 folder" after closing the
# dialog catches a miss (see the animation note below) and tries again —
# self-correcting regardless of starting state.
- retry:
    maxRetries: 2
    commands:
      # The Content row tops the Overlays sheet (#484) — guarded open
      # ('Close overlays' is the sheet's open-state sentinel).
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
      - tapOn: 'Map tab' # the sheet reopens on its last tab
      - extendedWaitUntil:
          visible: 'Content.*'
          timeout: 10000
      - tapOn: 'Content.*'
      - extendedWaitUntil:
          visible: 'Show on the map'
          timeout: 10000
      # The dialog's own enter animation must settle before tapping —
      # mid-animation the accessibility tree's reported bounds don't match
      # the transformed on-screen position yet, so a tap here can silently
      # miss the checkbox.
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: 'Ungrouped'
      - tapOn: 'Done'
      - assertVisible: 'Map actions'
      # Verify through the sheet: reopen and check the row.
      - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 10000
      - tapOn: 'Map tab' # the sheet reopens on its last tab
      - extendedWaitUntil:
          visible: 'Content: 1 folder'
          timeout: 10000
      - tapOn:
          point: 50%,8%
# The heat GPX-load effect is async (reads + parses both trails' files); give
# it a beat before probing for the rendered heat layer.
- waitForAnimationToEnd:
    timeout: 5000
# Park the user on A, the fix both recordings started from (their overlap).
- setLocation:
    latitude: 46.8139
    longitude: -71.2082
# Make sure the camera FOLLOWS the user, so the map's centre is A. 'Locate'
# is a toggle — idle it starts following, while following it STOPS — and it
# exposes which through its selected state, so tap it only when it is not
# selected (guarded), then wait for the selected state. Retried whole: a tap
# swallowed by a still-settling sheet just gets another go.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: 'Locate'
              selected: true
          commands:
            - tapOn: 'Locate'
      - extendedWaitUntil:
          visible:
            text: 'Locate'
            selected: true
          timeout: 10000
# Following glides the camera onto A (and Locate zooms in to ~2.5 km across
# if it was further out — never out). Let the glide finish before tapping.
- waitForAnimationToEnd:
    timeout: 5000
# Tap the centre of the map view: while following, the camera centre is the
# user, i.e. A. The heat lookup reaches ±2 grid cells (~40-50 m) around the
# tapped cell and widens with the finger tolerance when zoomed out, so a tap
# on A finds both Runs at ANY zoom — no zoom normalisation, no tap grid.
# Heat outranks the user dot in the tap routing (MapScreen handleMapPress),
# and a tap never stops following, so nothing else can claim this tap.
# Exactly one tap: a second one on an open carousel would close it.
- tapOn:
    id: 'map-area'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: 'Activities here'
    timeout: 10000
# Two cards minimum (both are auto-titled "<TimeOfDay> run · <place>" or
# date-defaulted "Trail …").
- assertVisible:
    text: 'Activity: .*'
    index: 1
# Tap the focused (first) card → trail viewer.
- tapOn:
    text: 'Activity: .*'
    index: 0
# The trail view mounted (its layers FAB; the old "Notes" tab is gone, #511).
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 30000
- tapOn: 'Back'
# 'Map actions' is NOT a reliable pop-complete signal here — and since wave
# A it cannot even appear yet: it lives on the top-right controls rail,
# which MapScreen unmounts entirely while the heat carousel is open (no
# hidden a11y nodes under the deck). Gate on the departing screen's own
# (unique) content going away instead; 'Map actions' is asserted only AFTER
# the carousel below is closed and the rail remounts.
# ("Export PDF" left with the trail-view revamp; it would pass vacuously.)
- extendedWaitUntil:
    notVisible: 'Trail layers'
    timeout: 15000
# The departing trail viewer's teardown (its MapLibre map) can starve the JS
# thread for several seconds after the screen itself is gone from the
# hierarchy — NOT a fixed-length transition animation. Verified on-device: reverting
# visibility can't be moved BEFORE the viewer trip instead (the obvious fix),
# because 'type'/"Everything" mode only shows `activeTrackIds` — see
# visibility.ts's `visibleTrackIds` — and a fresh recording's save path never
# populates that set, so both trails would vanish and the later heat re-tap
# would have nothing to hit. So the revert stays last, but every wait below
# is generously widened for a slow (not hung) JS thread rather than assuming
# a short, fixed settle.
- waitForAnimationToEnd:
    timeout: 5000
# The heat carousel opened before the card tap is NEVER torn down by
# navigating into the trail viewer: `trail3d/[id]` is a SIBLING stack screen
# (app/_layout.tsx), so the tab stack — MapScreen included — stays mounted
# underneath, and `heatSelection` is plain MapScreen-local state. It IS
# cleared at several other sites (the carousel's own onClose, a later
# single-trail/cold map tap, the Library-driven inspect-intent effect) — just
# not by the trail-viewer round trip this flow just took, so it's still set
# and the carousel is still fully showing its cards when Back lands us on the
# map — and the controls rail (Map overlays, Map actions) stays unmounted
# beneath it. Verified on-device (pre-wave-A variant): without this dismiss,
# the cleanup's "Map overlays" tap landed on the still-visible focused card
# underneath and bounced straight back into the trail viewer. Close it via
# its own button first.
- runFlow:
    when:
      visible: 'Close activities'
    commands:
      - tapOn: 'Close activities'
      - extendedWaitUntil:
          notVisible: 'Activities here'
          timeout: 5000
# Rail remounted (carousel gone) — NOW 'Map actions' confirms we're back.
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 15000
# Restore 'type' visibility mode so later flows (library-filter, trail-view,
# map-overlays, folders, …) see the app's default state, same as folders.yaml
# does at the end of its own run. "Everything" is also a checkbox (its
# onPress toggles 'type' <-> 'folders'), so same self-correcting retry as the
# setup block above — timeouts widened (30 s on the two post-tap waits) to
# absorb the post-viewer JS-thread stall instead of racing it.
#
# Tapping "Everything" only calls setMapVisibilityMode('type')
# (FolderPickerDialog.tsx) — it does NOT touch `visibleFolderIds`, which is a
# separate persisted field (library.json) only `toggleVisibleFolder` ever
# mutates. So the "Ungrouped" checkbox the setup block above checked would
# otherwise stay checked (and stay persisted) forever, even in 'type' mode
# where it's simply unused — until a LATER flow in the same CI job switches
# to 'folders' mode itself (folders.yaml ticking "TripA"), at which point the
# stale "ungrouped" entry silently joins that flow's own selection and skews
# its "Content: N folder(s)" count assertions. Uncheck "Ungrouped" (same tap
# that checked it — it's a toggle) BEFORE flipping back to "Everything", so
# both persisted fields return to their pre-flow state.
- retry:
    maxRetries: 3
    commands:
      # Guarded open of the Overlays sheet, then the Content picker (30 s
      # waits absorb the post-viewer JS-thread stall).
      - runFlow:
          when:
            notVisible: 'Close overlays'
          commands:
            - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 30000
      - tapOn: 'Map tab' # the sheet reopens on its last tab
      - extendedWaitUntil:
          visible: 'Content.*'
          timeout: 30000
      - tapOn: 'Content.*'
      - extendedWaitUntil:
          visible: 'Everything'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: 'Ungrouped'
      - tapOn: 'Everything'
      - tapOn: 'Done'
      - assertVisible: 'Map actions'
      - tapOn: 'Map overlays'
      - extendedWaitUntil:
          visible: 'Close overlays'
          timeout: 30000
      - tapOn: 'Map tab' # the sheet reopens on its last tab
      - extendedWaitUntil:
          visible: 'Content: everything'
          timeout: 30000
      - tapOn:
          point: 50%,8%
- assertVisible: 'Map actions'
