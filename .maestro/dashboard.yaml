# Logbook (the old Dashboard) e2e: the "Distance per week" chart and the
# Recent list show real data from the suite's fixture trail, the Week/Month/
# Year segment and the "Activities by type" chips (which are the type filter)
# drive the chart, and the month calendar taps through to the trail viewer.
#
# Portability notes:
# - MUST run after category-record.yaml: its freshly recorded Run trail
#   (recorded "today") is the fixture — deterministically inside every chart
#   window and on today's calendar cell.
# - The tab reads "Logbook", or "Logbook, tab, N of 4" on iOS; the regex covers
#   both.
# - Distances use formatDistance ("N.N km" / "N m"); assert a loose distance
#   regex, not an exact value (GPS fix jitter varies the sum).
# - The type chips carry accessibilityLabel "<Type>, <n> activit(y|ies)".
# - The negative filter case (Ski) proves the filter is real: the suite never
#   records a Ski activity, so the chart must flip to "No activities".
# - Revamp step 8 (After-Logbook.html) changed the selectors: the old dot
#   graph ("Activity graph", "Past 3 months"), the "Filter by category" menu and
#   the readout were replaced by the chart card, the Week/Month/Year segment
#   and the type chips; the calendar moved below "Recent", so it is scrolled to.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# retryTapIfNoChange, like library-filter/settings/trail-view: a tab tap fired
# mid-cold-start can be dropped while the hierarchy is churning (CI
# 2026-10-09, run 37893244108: the Map was still showing 15 s later).
- tapOn:
    text: 'Logbook(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Distance per week'
    timeout: 15000
# The chart subtitle and the Recent row carry today's fixture trail → a real distance.
- assertVisible: '.*(km|\d+ m).*'
# The fixture is inside the 12-week window, so the chart is not empty.
- assertNotVisible: 'No activities'
# Period switch: months, still data-bearing.
- tapOn: 'Month'
- extendedWaitUntil:
    visible: 'Distance per month'
    timeout: 10000
- assertNotVisible: 'No activities'
- tapOn: 'Week'
- extendedWaitUntil:
    visible: 'Distance per week'
    timeout: 10000
# Type filter: the fixture is a Run. Selecting Run keeps the chart populated.
- tapOn: 'Run, [1-9]\d* activit.*'
- assertNotVisible: 'No activities'
# Clear the filter again (tap the selected chip).
- tapOn: 'Run, [1-9]\d* activit.*'
# Calendar (below Recent): today's cell carries at least one activity; tapping
# opens the trail (single) or the picker (multiple — take the first row).
- scrollUntilVisible:
    element:
      text: '.*: [1-9] activit.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: '.*: [1-9] activit.*'
- runFlow:
    when:
      visible: 'Activities on.*'
    commands:
      # First row, by id (DayActivitiesDialog), not by name: the Logbook's RECENT list carries the same names
      # behind the scrim, and a name match with index 0 picked one of those
      # (its top edge peeks out above the dialog), so the tap hit the
      # dialog's margin and nothing opened (CI 2026-10-05).
      - tapOn:
          id: 'day-activity-0'
# The trail view mounted (its layers FAB; the old "Notes" tab is gone, #511).
- extendedWaitUntil:
    visible: 'Trail layers'
    timeout: 30000
# The trail viewer's floating back arrow (paper BackAction default label);
# 'back' the Maestro command is Android-only.
- tapOn: 'Back'
- extendedWaitUntil:
    visible: '.*: [1-9] activit.*'
    timeout: 15000
# Negative filter: no Ski activity exists → the chart says so.
- scrollUntilVisible:
    element:
      text: 'Ski, 0 activities'
    direction: UP
    timeout: 20000
    centerElement: true
- tapOn: 'Ski, 0 activities'
- extendedWaitUntil:
    visible: 'No activities'
    timeout: 10000
