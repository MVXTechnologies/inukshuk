# Folders e2e (1.3.0): create a folder, move the recorded trail into it via
# the ⋮ menu, switch the map to folder-visibility mode through the Layers
# menu's picker, prove the map stays alive, then switch back to type mode and
# DELETE the folder — the Library's layout flips to folder groups whenever a
# folder exists, and earlier flows (category-record, library-filter,
# trail-view) assert the no-folders "Recorded trails" section, so reruns need
# the folder gone.
#
# Portability notes:
# - Runs after category-record.yaml (needs >= 1 saved trail).
# - NameDialog's input is uncontrolled; typing then "Create" is race-free.
# - The trail card's menu anchor label is "More options"; folder rows appear
#   under a disabled "Move to folder" header inside it.
# - The Layers menu's "Folders" entry switches the visibility mode and opens
#   the "Show folders" picker dialog; tapping the "Trails (n)" row switches
#   back to type mode without disturbing the per-trail activation.
# - Drag-and-drop is deliberately NOT exercised (long-press-drag across a
#   scrolling list is flake bait on both drivers); the ⋮ path covers the same
#   store mutation.
appId: com.inukshuk.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: always
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- assertVisible: 'Recorded trails.*'
# --- Create a folder and move the trail in ---
- tapOn: 'New folder'
- extendedWaitUntil:
    visible: 'Folder name'
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'TripA'
- tapOn: 'Create'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible: 'TripA.*'
    timeout: 8000
- tapOn: 'More options'
- extendedWaitUntil:
    visible: 'Move to folder'
    timeout: 8000
# "Move to TripA" — the menu row's distinct a11y label; plain "TripA" would
# also match the folder section header sitting earlier in the tree.
- tapOn: 'Move to TripA'
- tapOn:
    point: 50%,8%
# The trail now lives in the folder group (header shows a count).
- assertVisible: 'TripA \(1\)'
# --- Folder-visibility mode on the map ---
- tapOn:
    text: 'Map(, tab.*)?'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Map actions'
    timeout: 30000
# Content visibility lives in the Overlays menu's Topology sub-menu (D-6
# drill-down): open the menu, drill into Topology, then the picker (the
# PDF/Trails type toggles are retired; "Everything" is the way back).
- tapOn: 'Map overlays'
- extendedWaitUntil:
    visible: 'Topology.*'
    timeout: 10000
- tapOn: 'Topology.*'
- extendedWaitUntil:
    visible: 'Content.*'
    timeout: 10000
- tapOn: 'Content.*'
- extendedWaitUntil:
    visible: 'Show on the map'
    timeout: 10000
- tapOn: 'TripA'
# A folder pick is one store write now (showFolder) instead of two full index
# serializations. The 1-in-5 failure the earlier `waitForAnimationToEnd` was
# added for never reproduced in 6 clean runs without it, so don't read this as
# a proven flake cure: retryTapIfNoChange is simply the right idiom — it
# retries a genuinely dropped tap instead of charging every run fixed latency.
- tapOn:
    text: 'Done'
    retryTapIfNoChange: true
- assertVisible: 'Map actions'
# Back to show-everything via the picker's Everything row.
- tapOn: 'Map overlays'
- extendedWaitUntil:
    visible: 'Topology.*'
    timeout: 10000
- tapOn: 'Topology.*'
- extendedWaitUntil:
    visible: 'Content: 1 folder'
    timeout: 10000
- tapOn: 'Content.*'
- extendedWaitUntil:
    visible: 'Everything'
    timeout: 10000
- tapOn: 'Everything'
- tapOn:
    text: 'Done'
    retryTapIfNoChange: true
- assertVisible: 'Map actions'
# --- Clean up: delete the folder so reruns see the no-folders layout ---
- tapOn:
    text: 'Library(, tab.*)?'
    retryTapIfNoChange: true
- tapOn: 'Delete folder'
- extendedWaitUntil:
    visible: 'Delete'
    timeout: 8000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Recorded trails.*'
    timeout: 8000
