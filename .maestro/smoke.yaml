# Maestro smoke flow: launches the app and walks the three tabs, asserting the
# key UI of each is present. Fast end-to-end confidence that navigation, the map
# screen, and the providers all mount without crashing.
appId: com.inukshuk.app
---
- launchApp:
    permissions:
      location: allow
- assertVisible: 'Record'
- tapOn: 'Library'
- assertVisible: 'Recorded trails'
- tapOn: 'Settings'
- assertVisible: 'Keep screen awake'
# The Settings screen has its own "Map" section header, which Maestro taps
# instead of the tab bar (navigation silently doesn't happen). Hop through
# Library — which has no exact-"Map" text — before returning to the Map tab.
- tapOn: 'Library'
- tapOn: 'Map'
- assertVisible: 'Record'
