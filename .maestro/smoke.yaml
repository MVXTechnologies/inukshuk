# Maestro smoke flow: launches the app and walks the three tabs, asserting the
# key UI of each is present. Fast end-to-end confidence that navigation, the map
# screen, and the providers all mount without crashing.
appId: com.inukshuk.app
---
- launchApp:
    permissions:
      location: allow
# The map screen's record entry point is now a "+" speed-dial (not a "Record"
# button); its accessibility label proves the map screen mounted.
- assertVisible: 'Map actions'
- tapOn: 'Library'
- assertVisible: 'Recorded trails'
- tapOn: 'Settings'
- assertVisible: 'Keep screen awake'
# Settings has its own "Map" section header that Maestro would tap instead of
# the tab bar; hop through Library (no exact-"Map" text) before returning.
- tapOn: 'Library'
- tapOn: 'Map'
# The speed-dial's accessibility label — proves the Map screen itself mounted
# (asserting 'Map' would match the tab label even if the screen failed).
- assertVisible: 'Map actions'
